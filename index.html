/* ============================================================
   11. TOAST
   ============================================================ */
let toastTimer;
function toast(text, undo){
  if (undo) pushHistory(text, undo);
  $('#toastText').textContent = text;
  const btn = $('#toastUndo');
  btn.hidden = !undo;
  btn.onclick = ()=>{ undo && undo(); hideToast(); };
  $('#toast').classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5200);
}
const hideToast = ()=> $('#toast').classList.remove('is-visible');

/* ============================================================
   12. API — the seam for the backend
   Swap each body for a fetch; the interface does not change.
   ============================================================ */
const Api = {
  /* GET /bookings?from=&to=   GET /shifts?from=&to= */

  /* POST /bookings */
  createBooking(draft){
    if (!draft.name.trim()){ toast('Give the booking a name first.'); return; }
    const b = { ...draft, id:newBkId() };
    BOOKINGS.push(b);
    select('booking', b.id);
    toast(b.facilityIds.length
      ? `${b.name} booked into ${b.facilityIds.map(f=>facility(f).short).join(' and ')}.`
      : `${b.name} created. No facility assigned yet.`,
      ()=>{ BOOKINGS = BOOKINGS.filter(x=>x.id!==b.id); closeInspector(); });
  },

  /* PATCH /bookings/:id */
  updateBooking(id, patch){
    const b = booking(id); if (!b) return;
    Object.assign(b, patch);
    /* Crew shifts follow the booking's date so none are orphaned. */
    if (patch.date) SHIFTS.filter(s=>s.bookingId===b.id).forEach(s=>{ s.date=patch.date; s.status='draft'; });
    render();
    if (patch.facilityIds) toast(b.facilityIds.length ? 'Facilities updated.' : 'Booking has no facility.');
  },

  /* DELETE /bookings/:id — cascades to its shifts */
  deleteBooking(id){
    const b = booking(id); if (!b) return;
    const snapB = { ...b }, snapS = SHIFTS.filter(s=>s.bookingId===id).map(s=>({...s}));
    BOOKINGS = BOOKINGS.filter(x=>x.id!==id);
    SHIFTS = SHIFTS.filter(s=>s.bookingId!==id);
    closeInspector();
    toast(`${b.name} deleted, along with ${snapS.length} shift${snapS.length===1?'':'s'}.`,
      ()=>{ BOOKINGS.push(snapB); SHIFTS.push(...snapS); render(); });
  },

  /* POST /bookings/:id/duplicate */
  duplicateBooking(id){
    const b = booking(id); if (!b) return;
    const nb = { ...b, id:newBkId(), date:addDays(b.date,1), status:'pencilled' };
    BOOKINGS.push(nb);
    SHIFTS.filter(s=>s.bookingId===id).forEach(s=>
      SHIFTS.push({ ...s, id:newShId(), bookingId:nb.id, date:nb.date, status:'draft' }));
    select('booking', nb.id);
    toast(`Copied to ${shortDay(nb.date)} as pencilled.`,
      ()=>{ BOOKINGS = BOOKINGS.filter(x=>x.id!==nb.id); SHIFTS = SHIFTS.filter(s=>s.bookingId!==nb.id); closeInspector(); });
  },

  /* POST /bookings/:id/crew — this is what creates the roster shift */
  addCrew(bookingId, roleId, staffId){
    const b = booking(bookingId); if (!b) return;
    const sh = { id:newShId(), bookingId, staffId:staffId||null, roleId,
      date:b.date, start:b.start, end:b.end, status:'draft', note:'' };
    SHIFTS.push(sh);
    /* Follow the person into their department so the new shift is visible. */
    if (staffId && state.deptFilter!=='all' && person(staffId).dept!==state.deptFilter){
      state.deptFilter = person(staffId).dept;
      $('#deptSelect').value = state.deptFilter;
    }
    render();
    toast(staffId ? `${person(staffId).name} added — shift is on the roster.` : 'Position added to the tray.',
      ()=>{ SHIFTS = SHIFTS.filter(x=>x.id!==sh.id); render(); });
  },

  /* POST /shifts — manual shift, booking optional */
  createShift(d){
    const sh = { id:newShId(), status:'draft', note:'', ...d };
    SHIFTS.push(sh);
    select('shift', sh.id);
    const b = sh.bookingId?booking(sh.bookingId):null;
    toast(b ? `Shift added to ${b.name}.` : 'Shift added with no booking.',
      ()=>{ SHIFTS = SHIFTS.filter(x=>x.id!==sh.id); closeInspector(); });
  },

  /* PATCH /shifts/:id */
  updateShift(id, patch, followBooking){
    const s = byId(SHIFTS,id); if (!s) return;
    Object.assign(s, patch);
    if (followBooking && patch.bookingId){
      const b = booking(patch.bookingId);
      if (b){ s.start=b.start; s.end=b.end; s.date=b.date; }
    }
    if (patch.status===undefined && s.status==='confirmed') s.status='published';
    render();
  },

  /* PATCH /shifts/:id { staffId, date } — drag and drop */
  moveShift(id, staffId, date){
    const s = byId(SHIFTS,id); if (!s) return;
    const before = { staffId:s.staffId, date:s.date, status:s.status };
    /* Drag-and-drop is where a slow save would be most obvious, so the
       move draws immediately and the bar carries a pending shimmer
       until the write settles. Returning the fetch from inside here is
       all it takes once the endpoint exists. */
    withPending([s.id], ()=>{
      s.staffId = staffId;
      if (date) s.date = date;
      s.status = 'draft';
    });
    const issues = shiftConflicts(s);
    const hard = issues.find(c=>c.level==='hard');
    toast(hard ? `${person(staffId).name} — ${hard.title.toLowerCase()}.` : `${person(staffId).name} rostered.`,
      ()=>{ Object.assign(s, before); render(); });
    if (issues.length) select('shift', s.id);
  },

  /* DELETE /shifts/:id */
  removeShift(id){
    const s = byId(SHIFTS,id); if (!s) return;
    const snap = { ...s };
    SHIFTS = SHIFTS.filter(x=>x.id!==id);
    if (state.sel && state.sel.kind==='shift' && state.sel.id===id) closeInspector(); else render();
    toast('Shift removed.', ()=>{ SHIFTS.push(snap); render(); });
  },

  /* PATCH /shifts/:id { start, end } — dragging a bar's end */
  resizeShift(id, start, end){
    const s = byId(SHIFTS, id); if (!s) return;
    const before = { start:s.start, end:s.end, status:s.status };
    withPending([s.id], ()=>{ s.start = start; s.end = end; s.status = 'draft'; });
    const issues = shiftConflicts(s);
    const hard = issues.find(c=>c.level==='hard');
    toast(hard ? `${start}–${end} — ${hard.title.toLowerCase()}.` : `Call ${start}, wrap ${end}.`,
      ()=>{ Object.assign(s, before); render(); });
  },

  /* PATCH /bookings/:id { start, end } — dragging a bar's end */
  resizeBooking(id, start, end){
    const b = booking(id); if (!b) return;
    const before = { start:b.start, end:b.end };
    const dS = mins(start) - mins(b.start), dE = mins(end) - mins(b.end);
    /* Crew hours move with the booking, keeping each person's own call
       and wrap offsets, and drop back to draft so they're republished. */
    const shifts = SHIFTS.filter(x=>x.bookingId===b.id).map(x=>({ id:x.id, start:x.start, end:x.end, status:x.status }));
    withPending([b.id], ()=>{
      b.start = start; b.end = end;
      shifts.forEach(o=>{
        const live = byId(SHIFTS, o.id);
        live.start = addMins(o.start, dS);
        live.end = addMins(o.end, dE);
        live.status = 'draft';
      });
    });
    toast(`${b.name} now ${start}–${end}.`,
      ()=>{ Object.assign(b, before);
            shifts.forEach(o=>{ const live=byId(SHIFTS,o.id); if (live) Object.assign(live, o); });
            render(); });
  },

  /* PATCH /bookings/:id { facilityIds, date } — drag and drop */
  moveBooking(id, facId, date, fromFac){
    const b = booking(id); if (!b) return;
    const before = { facilityIds:[...b.facilityIds], date:b.date };
    const i = b.facilityIds.indexOf(fromFac);
    if (!b.facilityIds.includes(facId)){
      if (i>-1) b.facilityIds[i] = facId; else b.facilityIds.push(facId);
    }
    withPending([b.id], ()=>{
      if (date && date!==b.date){
        b.date = date;
        SHIFTS.filter(s=>s.bookingId===b.id).forEach(s=>{ s.date=date; s.status='draft'; });
      }
    });
    const clash = bookingConflicts(b).find(c=>c.type==='facility');
    toast(clash ? `Moved — ${clash.title.toLowerCase()}.` : `${b.name} moved to ${facility(facId).name}.`,
      ()=>{ Object.assign(b, before); render(); });
  },

  /* POST /bookings/:id/copy { facilityIds, date } — Option-drag */
  copyBookingTo(id, facId, date){
    const b = booking(id); if (!b) return;
    const nb = { ...b, id:newBkId(), wo:newWorkOrder(), date: date || b.date,
      facilityIds:[facId], status:'pencilled',
      tx:(b.tx||[]).map(t=>({...t})) };
    BOOKINGS.push(nb);
    SHIFTS.filter(s=>s.bookingId===id).forEach(s=>
      SHIFTS.push({ ...s, id:newShId(), bookingId:nb.id, date:nb.date, status:'draft' }));
    select('booking', nb.id);
    toast(`Copied to ${facility(facId).short}, ${shortDay(nb.date)}, as pencilled.`,
      ()=>{ BOOKINGS = BOOKINGS.filter(x=>x.id!==nb.id);
            SHIFTS = SHIFTS.filter(s=>s.bookingId!==nb.id); closeInspector(); });
  },

  /* POST /crew/:id/days-off — every day this week they have nothing on.
     Scoped to the week on screen, because a day off is a rostering
     decision for a particular week, not a standing rule. */
  addRdos(staffId){
    const p = person(staffId); if (!p) return;
    if (!isFullTime(p)){ toast(`${p.name} is freelance — no rostered days off to mark.`); return; }
    const free = freeDays(staffId, weekDays());
    if (!free.length){ toast(`${p.name} has no free day this week.`); return; }
    const made = free.map(date=>({ id:newOffId(), staffId, date, start:RDO_START, end:RDO_END }));
    OFFDAYS.push(...made);
    render();
    const short = free.length===1 ? shortDay(free[0]) : `${free.length} days`;
    toast(`${p.name} — ${short} marked as rostered days off.`,
      ()=>{ const ids = new Set(made.map(x=>x.id));
            OFFDAYS = OFFDAYS.filter(o=>!ids.has(o.id)); render(); });
  },

  /* DELETE /days-off/:id */
  removeRdo(id){
    const o = OFFDAYS.find(x=>x.id===id); if (!o) return;
    OFFDAYS = OFFDAYS.filter(x=>x.id!==id);
    render();
    toast(`${person(o.staffId).name} — ${shortDay(o.date)} is no longer a day off.`,
      ()=>{ OFFDAYS.push(o); render(); });
  },

  /* POST /shows */
  createShow(draft){
    if (!draft.name.trim()){ toast('Give the show a name first.'); return; }
    const sh = cloneShow({ ...draft, id:newShowId() });
    SHOWS.push(sh);
    openShow(sh.id);
    toast(`${sh.name} created.`, ()=>{ SHOWS = SHOWS.filter(x=>x.id!==sh.id); closeShowEditor(); });
  },

  /* PATCH /shows/:id  — and, in the same call, the bookings that
     follow it. scope is 'future' (from today), 'all', or 'none'.
     The backend does this as one transaction: the show row, then the
     bookings and shifts it owns, so a half-applied change can't sit
     on the roster. */
  saveShow(id, draft, scope){
    const sh = byId(SHOWS, id); if (!sh) return;
    if (!draft.name.trim()){ toast('Give the show a name first.'); return; }

    const changes = showDiff(sh, draft);
    if (!changes.length){ toast('Nothing to save.'); return; }

    const snapshot = {
      show: cloneShow(sh),
      bookings: BOOKINGS.map(b=>({ ...b, facilityIds:[...b.facilityIds] })),
      shifts: SHIFTS.map(s=>({ ...s })),
    };

    const targets = scopedBookings(id, scope);
    const rep = applyShowToBookings(sh, draft, targets);
    Object.assign(sh, cloneShow(draft), { id });
    state.showDraft = cloneShow(sh);
    render();

    const bits = [];
    if (rep.bookings)   bits.push(`${rep.bookings} booking${rep.bookings===1?'':'s'} updated`);
    if (rep.moved)      bits.push(`${rep.moved} shift${rep.moved===1?'':'s'} back to draft`);
    if (rep.reassigned) bits.push(`${rep.reassigned} reassigned`);
    if (rep.added)      bits.push(`${rep.added} added`);
    if (rep.removed)    bits.push(`${rep.removed} open shift${rep.removed===1?'':'s'} removed`);
    if (rep.kept)       bits.push(`${rep.kept} filled shift${rep.kept===1?'':'s'} kept off-template`);

    toast(`${sh.name} saved${bits.length?` — ${bits.join(', ')}`:', bookings left as they were'}.`,
      ()=>{
        Object.assign(sh, snapshot.show);
        BOOKINGS = snapshot.bookings;
        SHIFTS = snapshot.shifts;
        state.showDraft = cloneShow(sh);
        render();
      });
  },

  /* DELETE /shows/:id — bookings already generated from it stay put,
     they just lose the "from <show>" badge. */
  deleteShow(id){
    const sh = byId(SHOWS, id); if (!sh) return;
    const snap = cloneShow(sh);
    SHOWS = SHOWS.filter(x=>x.id!==id);
    closeShowEditor();
    toast(`${sh.name} deleted. Bookings already on the roster are unaffected.`,
      ()=>{ SHOWS.push(snap); openShow(id); });
  },

  /* POST /shows/:id/duplicate — a copy gets its own position ids, so
     editing the copy never reaches the original's bookings. */
  duplicateShow(id){
    const sh = byId(SHOWS, id); if (!sh) return;
    const copy = { ...cloneShow(sh), id:newShowId(), name:sh.name+' copy',
      positions: sh.positions.map(p=>({ ...p, pid:newPosId() })) };
    SHOWS.push(copy);
    openShow(copy.id);
    toast(`Duplicated as "${copy.name}".`, ()=>{ SHOWS = SHOWS.filter(x=>x.id!==copy.id); openShow(id); });
  },

  /* POST /shows/:id/generate { from, to } — one booking per matching
     day in range, crewed from the standard crew; skips dates that
     already have a booking from this show. */
  generateBookings(showId, fromIso, toIso){
    const sh = byId(SHOWS, showId); if (!sh) return;
    if (sh.oneOff && !sh.oneOffDate){ toast('Give the show a date first.'); return; }
    if (!sh.oneOff && !sh.days.length){ toast('Pick at least one day before generating.'); return; }
    if (!fromIso || !toIso || toIso<fromIso){ toast('Check the date range.'); return; }
    let created=0, skipped=0, d=fromIso;
    const newIds=[];
    while (d<=toIso){
      if (sh.oneOff ? sh.oneOffDate===d : sh.days.includes(toDate(d).getDay())){
        if (BOOKINGS.some(b=>b.showId===showId && b.date===d)) skipped++;
        else {
          const b = { id:newBkId(), wo:newWorkOrder(), name:sh.name, client:'', date:d,
            start:sh.start, end:sh.end,
            facilityIds:[...sh.facilityIds], colour:sh.colour,
            project:sh.project, jobDetails:sh.jobDetails, tx:sh.tx.map(t=>({...t})),
            status:'pencilled', notes:sh.notes, showId };
          BOOKINGS.push(b); newIds.push(b.id);
          sh.positions.forEach(p=>{
            SHIFTS.push({ id:newShId(), bookingId:b.id, showId, posId:p.pid, staffId:p.staffId,
              roleId:p.roleId, date:d, start:posStart(sh,p), end:posEnd(sh,p), status:'draft', note:'' });
          });
          created++;
        }
      }
      d = addDays(d,1);
    }
    render();
    toast(created
      ? `${created} booking${created===1?'':'s'} created${skipped?`, ${skipped} already existed`:''}.`
      : sh.oneOff
      ? `${sh.name} is already on the roster.`
      : 'Nothing to create — bookings already exist for every matching day in range.',
      created ? ()=>{ BOOKINGS = BOOKINGS.filter(b=>!newIds.includes(b.id));
                       SHIFTS = SHIFTS.filter(s=>!newIds.includes(s.bookingId)); render(); } : null);
  },

  /* POST /staff */
  createStaff(draft){
    if (!draft.name.trim()){ toast('Give them a name first.'); return; }
    if (!draft.positions.length){ toast('Add at least one position first.'); return; }
    const p = { ...draft, id:newStaffId() };
    STAFF.push(p);
    openCrewMember(p.id);
    toast(`${p.name} added to the crew.`, ()=>{ STAFF = STAFF.filter(x=>x.id!==p.id); closeCrewDetail(); });
  },

  /* PATCH /staff/:id */
  updateStaff(id, patch){
    const p = byId(STAFF, id); if (!p) return;
    Object.assign(p, patch);
    renderCrewModal();
  },

  /* DELETE /staff/:id — their shifts go back to the tray rather than
     vanishing, since the position still needs covering. */
  deleteStaff(id){
    const p = byId(STAFF, id); if (!p) return;
    const snap = { ...p };
    const affected = SHIFTS.filter(s=>s.staffId===id).map(s=>({...s}));
    affected.forEach(s=>{ const live = byId(SHIFTS, s.id); live.staffId=null; live.status='draft'; });
    STAFF = STAFF.filter(x=>x.id!==id);
    closeCrewDetail();
    toast(`${p.name} removed. ${affected.length} shift${affected.length===1?'':'s'} moved back to the tray.`,
      ()=>{ STAFF.push(snap);
            affected.forEach(s=>{ const live=byId(SHIFTS,s.id); if (live){ live.staffId=s.staffId; live.status=s.status; } });
            render(); openCrewMember(id); });
  },
};

/* --- keep the two panes horizontally in step --- */
let syncing = false;
function linkScroll(a,b){
  a.addEventListener('scroll', ()=>{
    if (syncing) return;
    syncing = true; b.scrollLeft = a.scrollLeft;
    requestAnimationFrame(()=>{ syncing = false; });
  });
}
linkScroll(facScroll, crewScroll);
linkScroll(crewScroll, facScroll);

/* --- splitter --- */
(()=>{
  const sp = $('#splitter'), ws = $('#workspace');
  let dragging = false;
  const apply = y=>{
    const r = ws.getBoundingClientRect();
    ws.style.setProperty('--top-h', Math.min(78, Math.max(18, ((y-r.top)/r.height)*100))+'%');
  };
  sp.addEventListener('pointerdown', e=>{ dragging=true; sp.setPointerCapture(e.pointerId); });
  sp.addEventListener('pointermove', e=>{ if (dragging) apply(e.clientY); });
  sp.addEventListener('pointerup', e=>{ dragging=false; sp.releasePointerCapture(e.pointerId); });
  sp.addEventListener('keydown', e=>{
    const cur = parseFloat(ws.style.getPropertyValue('--top-h')) || 44;
    if (e.key==='ArrowUp'){ ws.style.setProperty('--top-h', Math.max(18,cur-4)+'%'); e.preventDefault(); }
    if (e.key==='ArrowDown'){ ws.style.setProperty('--top-h', Math.min(78,cur+4)+'%'); e.preventDefault(); }
  });
})();

/* --- drag and drop --- */
let drag = null;
document.addEventListener('dragstart', e=>{
  const el = e.target.closest('[data-shift],[data-booking],[data-staffname]');
  if (!el || resizing) return;
  drag = el.dataset.shift ? { kind:'shift', id:el.dataset.shift }
       : el.dataset.booking ? { kind:'booking', id:el.dataset.booking, fromFac:el.dataset.fac }
       : { kind:'staff', id:el.dataset.staffname };
  el.classList.add('is-dragging');
  document.body.classList.add('is-dragging-any');
  e.dataTransfer.effectAllowed = e.altKey ? 'copy' : 'move';
  e.dataTransfer.setData('text/plain', drag.id);
  /* Show every target's verdict up front rather than one at a time. */
  paintDropTargets();
});
document.addEventListener('dragend', ()=>{
  $$('.is-dragging').forEach(x=>x.classList.remove('is-dragging'));
  document.body.classList.remove('is-dragging-any');
  clearVerdicts();
  drag = null;
});

/* Hovering a booking or shift glows it and everything else tied to the
   same booking — the booking's own bar, and every crew shift on it —
   so it's obvious at a glance who's on what without opening it. */
function glowTargets(el){
  let bookingId = el.dataset.booking || null;
  if (!bookingId && el.dataset.shift){
    const sh = byId(SHIFTS, el.dataset.shift);
    bookingId = sh ? sh.bookingId : null;
  }
  const out = [el];
  if (bookingId){
    $$(`[data-booking="${bookingId}"]`).forEach(x=>out.push(x));
    SHIFTS.filter(s=>s.bookingId===bookingId).forEach(s=>{
      $$(`[data-shift="${s.id}"]`).forEach(x=>out.push(x));
    });
  }
  return out;
}
document.addEventListener('mouseover', e=>{
  const el = e.target.closest('.wbar,.tl-bar,.block[data-shift],.block[data-booking]');
  if (!el) return;
  glowTargets(el).forEach(x=>x.classList.add('is-glow'));
});
document.addEventListener('mouseout', e=>{
  const el = e.target.closest('.wbar,.tl-bar,.block[data-shift],.block[data-booking]');
  if (!el) return;
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  $$('.is-glow').forEach(x=>x.classList.remove('is-glow'));
});

/* The verdicts are painted once at dragstart; dragover only has to say
   whether this particular target will accept the drop. */
document.addEventListener('dragover', e=>{
  if (!drag) return;
  const bar = drag.kind==='staff' ? e.target.closest('[data-booking]') : null;
  const t = bar || e.target.closest('.cell, .tl-lane, #tray');
  if (!t) return;
  const ok = bar ? !t.classList.contains('is-invalid') && !t.classList.contains('is-busy')
     : t.id==='tray' ? drag.kind==='shift'
     : drag.kind==='booking' ? !!t.dataset.fac
     : drag.kind==='shift' ? !!t.dataset.staff && !t.classList.contains('is-invalid')
     : false;
  if (!ok) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = (e.altKey && drag.kind==='booking') ? 'copy' : 'move';
  t.classList.add('is-over');
});
document.addEventListener('dragleave', e=>{
  const t = e.target.closest && e.target.closest('.is-over');
  if (t) t.classList.remove('is-over');
});
document.addEventListener('drop', e=>{
  if (!drag) return;
  const bar = drag.kind==='staff' ? e.target.closest('[data-booking]') : null;
  const t = bar || e.target.closest('.cell, .tl-lane, #tray');
  if (!t) return;
  e.preventDefault();
  $$('.is-over').forEach(x=>x.classList.remove('is-over'));
  const d = drag;
  if (bar){ fillFromStaff(bar.dataset.booking, d.id); return; }
  if (t.id==='tray'){ if (d.kind==='shift') Api.updateShift(d.id,{staffId:null}); return; }
  if (d.kind==='booking' && t.dataset.fac){
    /* Option held: leave the original where it is and drop a copy. */
    if (e.altKey) Api.copyBookingTo(d.id, t.dataset.fac, t.dataset.date);
    else Api.moveBooking(d.id, t.dataset.fac, t.dataset.date, d.fromFac);
  }
  if (d.kind==='shift' && t.dataset.staff) Api.moveShift(d.id, t.dataset.staff, t.dataset.date);
});

/* ============================================================
   13c. DIRECT MANIPULATION
   The schedule is the control surface. Bars resize by their ends,
   people drag onto bookings, a held Option copies instead of moves,
   and the rules are shown while you drag rather than reported after
   you drop.
   ============================================================ */

/* ---------- multi-step undo ----------
   Every Api method already builds a closure that puts things back —
   they were only ever reachable from a toast that vanished after five
   seconds. Collecting them gives the whole session an undo stack. */
const HISTORY = [];
const HISTORY_MAX = 60;
function pushHistory(label, undo){
  HISTORY.push({ label, undo });
  if (HISTORY.length > HISTORY_MAX) HISTORY.shift();
}
function undoLast(){
  const entry = HISTORY.pop();
  if (!entry){ toast('Nothing left to undo.'); return; }
  entry.undo();
  /* No undo closure on this one — undoing an undo is redo, and redo
     isn't here yet. */
  toast(`Undone — ${entry.label.replace(/\.$/,'')}.`);
}

/* ---------- what a drop would do ----------
   The same three rules the checks use, asked before the drop instead
   of after it: is this person signed off for the position, are they
   already on something at that hour, and would this leave them less
   than the minimum break. */
function dropVerdict(shift, staffId, date){
  const p = person(staffId);
  if (!p) return 'invalid';
  if (!hasRole(p, shift.roleId)) return 'invalid';
  const probe = { ...shift, staffId, date: date || shift.date };
  const me = span(probe);
  let tight = false;
  for (const o of idx().byStaff.get(staffId) || []){
    if (o.id === shift.id) continue;
    const t = span(o);
    if (me.s < t.e && t.s < me.e) return 'busy';
    const gap = (me.s >= t.e ? me.s - t.e : t.s - me.e) / 60;
    if (gap >= 0 && gap < RULES.minTurnaroundHours) tight = true;
  }
  return tight ? 'tight' : 'ok';
}
function facilityVerdict(b, facId, date){
  const probe = { ...b, date: date || b.date };
  const me = span(probe);
  for (const o of idx().byDate.get(probe.date) || []){
    if (o.id === b.id || !o.facilityIds.includes(facId)) continue;
    const t = span(o);
    if (me.s < t.e && t.s < me.e) return 'busy';
  }
  return 'ok';
}
const VERDICT_CLASS = { ok:'is-dropping', tight:'is-tight', busy:'is-busy', invalid:'is-invalid' };
const clearVerdicts = ()=> $$('.is-dropping,.is-invalid,.is-busy,.is-tight')
  .forEach(x=>x.classList.remove('is-dropping','is-invalid','is-busy','is-tight'));

/* Marked once when the drag starts, across every visible target, so
   the whole picture is there before the cursor arrives rather than one
   cell at a time under it. */
function paintDropTargets(){
  if (!drag) return;
  clearVerdicts();
  if (drag.kind === 'staff'){
    const p = person(drag.id);
    $$('[data-booking]').forEach(el=>{
      const b = booking(el.dataset.booking); if (!b) return;
      const open = SHIFTS.filter(s=>s.bookingId===b.id && !s.staffId);
      const fit = open.find(s=>hasRole(p, s.roleId));
      el.classList.add(!open.length ? 'is-invalid'
        : !fit ? 'is-invalid'
        : VERDICT_CLASS[dropVerdict(fit, p.id, b.date)]);
    });
    return;
  }
  if (drag.kind === 'booking'){
    const b = booking(drag.id); if (!b) return;
    $$('.cell[data-fac], .tl-lane[data-fac]').forEach(el=>{
      el.classList.add(VERDICT_CLASS[facilityVerdict(b, el.dataset.fac, el.dataset.date)]);
    });
    return;
  }
  if (drag.kind === 'shift'){
    const s = byId(SHIFTS, drag.id); if (!s) return;
    $$('.cell[data-staff], .tl-lane[data-staff]').forEach(el=>{
      el.classList.add(VERDICT_CLASS[dropVerdict(s, el.dataset.staff, el.dataset.date)]);
    });
  }
}

/* ---------- resize by the ends ----------
   Only in the day timeline, where a lane is the full width of the pane
   and a pixel is worth about a minute. In the week grid a column is
   190px for 22 hours, which is not a surface anyone should be asked to
   aim at. */
const TL_MINUTES = (TL_B - TL_A) * 60;
const SNAP = 5;
let resizing = null;

function laneMinutes(lane, clientX){
  const r = lane.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  return TL_A * 60 + frac * TL_MINUTES;
}
const snap = m => Math.round(m / SNAP) * SNAP;
const clockOf = m => addMins('00:00', ((Math.round(m) % 1440) + 1440) % 1440);

/* Hit-testing a 14px child inside a draggable <button> turned out to be
   the wrong foundation: WebKit retargets events inside buttons, an
   overflow rule can clip the child, and the native drag starts from the
   same press. So nothing is hit-tested. The bar measures the pointer
   against its own box and decides for itself whether this is a resize
   or a move, before the press even lands. */
const EDGE_PX = 9;       /* how close to an end counts as grabbing it */
const MIN_BAR_PX = 26;   /* narrower than this and the whole bar is a move */

function edgeAt(bar, clientX){
  const r = bar.getBoundingClientRect();
  if (r.width < MIN_BAR_PX) return null;
  const zone = Math.min(EDGE_PX, r.width / 3);
  if (clientX - r.left <= zone) return 'start';
  if (r.right - clientX <= zone) return 'end';
  return null;
}
/* Armed on hover, so by the time a press arrives the bar has already
   stopped being draggable and there is no race to lose. */
document.addEventListener('pointermove', e=>{
  if (resizing) return;
  const bar = e.target && e.target.closest && e.target.closest('.tl-bar,.wbar');
  if (!bar){
    if (armed){ armed.classList.remove('is-edge-s','is-edge-e'); armed.draggable = true; armed = null; }
    return;
  }
  if (armed && armed !== bar){ armed.classList.remove('is-edge-s','is-edge-e'); armed.draggable = true; }
  const edge = edgeAt(bar, e.clientX);
  bar.classList.toggle('is-edge-s', edge==='start');
  bar.classList.toggle('is-edge-e', edge==='end');
  bar.draggable = !edge;
  armed = edge ? bar : null;
});
let armed = null;
let suppressClick = 0;

function laneOf(bar){ return bar.closest('.tl-lane') || bar.parentElement; }

function endResize(commit){
  if (!resizing) return;
  const { bar, rec, kind, next, from, pointerId } = resizing;
  try { bar.releasePointerCapture(pointerId); } catch (err) {}
  bar.classList.remove('is-resizing');
  bar.draggable = true;
  document.body.classList.remove('is-resizing-any');
  const changed = next && (next.start !== from.start || next.end !== from.end);
  resizing = null;
  if (!commit || !changed){ render(); return; }
  /* The click that follows the release would otherwise select the bar
     and reopen the inspector over the top of the change. */
  suppressClick = Date.now();
  if (kind === 'shift') Api.resizeShift(rec.id, next.start, next.end);
  else Api.resizeBooking(rec.id, next.start, next.end);
}

document.addEventListener('pointerdown', e=>{
  const bar = e.target && e.target.closest && e.target.closest('.tl-bar,.wbar');
  if (!bar) return;
  const edge = edgeAt(bar, e.clientX);
  if (!edge) return;
  const lane = laneOf(bar);
  const rec = bar.dataset.shift ? byId(SHIFTS, bar.dataset.shift) : booking(bar.dataset.booking);
  if (!lane || !rec) return;

  e.preventDefault();
  e.stopPropagation();
  bar.draggable = false;
  hideHover();
  /* A week cell is a fifth the width of a day lane, so it snaps to a
     coarser grid — a quarter hour you can actually land on. */
  const pxPerMin = lane.getBoundingClientRect().width / TL_MINUTES;
  resizing = {
    edge, lane, bar, rec, pointerId: e.pointerId,
    step: pxPerMin > 0.55 ? 5 : 15,
    kind: bar.dataset.shift ? 'shift' : 'booking',
    from: { start: rec.start, end: rec.end },
    /* Everything else this person or room already has that day, so the
       edge stops against it instead of running through it. */
    walls: (bar.dataset.shift
      ? (idx().byStaff.get(rec.staffId) || []).filter(x=>x.id!==rec.id && x.date===rec.date)
      : (idx().byDate.get(rec.date) || []).filter(x=>x.id!==rec.id
          && x.facilityIds.some(f=>rec.facilityIds.includes(f)))
    ).map(x=>({ s: mins(x.start), e: mins(x.end) <= mins(x.start) ? mins(x.end)+1440 : mins(x.end) })),
  };
  try { bar.setPointerCapture(e.pointerId); } catch (err) {}
  bar.classList.add('is-resizing');
  document.body.classList.add('is-resizing-any');
});

document.addEventListener('pointermove', e=>{
  if (!resizing || e.pointerId !== resizing.pointerId) return;
  const { edge, lane, bar, from, walls, step } = resizing;
  if (!lane.getBoundingClientRect().width) return;
  let s = mins(from.start), en = mins(from.end);
  if (en <= s) en += 1440;
  let m = Math.round(laneMinutes(lane, e.clientX) / step) * step;

  if (edge === 'start'){
    m = Math.min(m, en - step);
    for (const w of walls) if (w.e <= en && m < w.e) m = Math.max(m, w.e);
    s = m;
  } else {
    m = Math.max(m, s + step);
    for (const w of walls) if (w.s >= s && m > w.s) m = Math.min(m, w.s);
    en = m;
  }
  resizing.next = { start: clockOf(s), end: clockOf(en) };
  bar.style.left = tlPos(s/60) + '%';
  bar.style.width = Math.max(((en - s) / TL_MINUTES) * 100, 1.2) + '%';
  const label = bar.querySelector('.tl-bar__t, .wbar__t');
  if (label) label.textContent = `${clockOf(s)}${bar.classList.contains('wbar')?'-':'–'}${clockOf(en)}`;
});

document.addEventListener('pointerup', e=>{
  if (resizing && e.pointerId === resizing.pointerId) endResize(true);
});
/* A cancelled pointer — a browser gesture taking over, the window
   losing focus mid-drag — must not leave a bar stuck mid-resize. */
document.addEventListener('pointercancel', ()=> endResize(false));
window.addEventListener('blur', ()=> endResize(false));

/* Only the click that belongs to the gesture just finished — a stale
   flag would swallow the user's next real click somewhere else. */
document.addEventListener('click', e=>{
  if (!suppressClick) return;
  const own = Date.now() - suppressClick < 350;
  suppressClick = 0;
  if (!own) return;
  e.stopPropagation();
  e.preventDefault();
}, true);

/* ---------- crew drag onto a booking ----------
   Dragging a name onto a bar fills the first open position that person
   is signed off for. It is the gesture people reach for first, and
   until now it did nothing. */
function fillFromStaff(bookingId, staffId){
  const b = booking(bookingId), p = person(staffId);
  if (!b || !p) return;
  const open = SHIFTS.filter(s=>s.bookingId===b.id && !s.staffId);
  if (!open.length){ toast(`${b.name} has no open positions.`); return; }
  const fit = open.find(s=>hasRole(p, s.roleId));
  if (!fit){
    toast(`${p.name} isn't signed off for anything open on ${b.name}.`);
    return;
  }
  Api.moveShift(fit.id, staffId, fit.date);
}

/* ---------- optimistic state ----------
   Every mutation today is local and instant. When the backend lands,
   each one becomes a round trip, and the roster shouldn't freeze or
   lie while it's in flight. Api methods wrap their work in this:
   the change is applied and drawn immediately, the affected bars
   shimmer until the call settles, and a rejected promise rolls the
   pending flag off the same way a resolved one does. Sync work
   settles on the same tick, so nothing flickers now. */
const PENDING = new Set();
function isPending(id){ return PENDING.has(id); }
function withPending(ids, work){
  ids.forEach(i=>PENDING.add(i));
  let result;
  const settle = ()=>{ ids.forEach(i=>PENDING.delete(i)); render(); };
  try { result = work(); }
  catch (err){ settle(); throw err; }
  if (result && typeof result.then==='function'){ render(); result.then(settle, settle); }
  else settle();
  return result;
}

/* ---------- the search field is the filter ----------
   One control instead of a field plus a menu. Typing narrows as you go;
   pressing Enter on a suggestion turns it into a pill you can see and
   remove. Nothing filters invisibly, so there is no state to remember
   you left switched on. */

const TOKEN_LABEL = {
  problems: 'Problems only',
  unfilled: 'Unfilled positions',
};
function tokenLabel(t){
  if (t.type==='flag') return TOKEN_LABEL[t.value] || t.value;
  if (t.type==='room') return facility(t.value).name;
  if (t.type==='crew') { const p = person(t.value); return p ? p.name : t.value; }
  if (t.type==='show') { const sh = byId(SHOWS, t.value); return sh ? sh.name : t.value; }
  if (t.type==='dept') return dept(t.value).name;
  return t.value;
}
const TOKEN_KIND = { flag:'Filter', room:'Room', crew:'Crew', show:'Show', dept:'Department' };
const hasToken = (type, value)=> state.tokens.some(t=>t.type===type && t.value===value);
const tokensOf = type => state.tokens.filter(t=>t.type===type).map(t=>t.value);

function addToken(t){
  if (hasToken(t.type, t.value)) return;
  state.tokens.push(t);
  $('#search').value = '';
  state.search = '';
  closeSuggest();
  renderTokens();
  render();
}
function removeToken(i){
  state.tokens.splice(i, 1);
  renderTokens();
  render();
}
function clearTokens(){
  state.tokens = [];
  state.search = '';
  $('#search').value = '';
  renderTokens();
  render();
}

function renderTokens(){
  const wrap = $('#searchTokens');
  wrap.innerHTML = state.tokens.map((t,i)=>`
    <span class="token token--${t.type}">
      <span class="token__k">${TOKEN_KIND[t.type]}</span>
      <span class="token__v">${esc(tokenLabel(t))}</span>
      <button class="token__x" data-rmtoken="${i}" aria-label="Remove ${esc(tokenLabel(t))} filter">${svgX(9)}</button>
    </span>`).join('');
  $('#searchWrap').classList.toggle('has-tokens', state.tokens.length>0);
  $$('[data-rmtoken]').forEach(el=> el.onclick = e=>{
    e.preventDefault(); e.stopPropagation();
    removeToken(Number(el.dataset.rmtoken));
  });
}

/* What the typed text could become. Flags first, since they are the two
   things people reach for most, then the named things. */
function suggestFor(q){
  const t = q.trim().toLowerCase();
  const out = [];
  const push = (type, value)=>{ if (!hasToken(type, value)) out.push({ type, value }); };
  const match = str => !t || str.toLowerCase().includes(t);

  if (match('problems') || match('clash') || match('conflict')) push('flag','problems');
  if (match('unfilled') || match('open')) push('flag','unfilled');
  if (t){
    FACILITIES.filter(f=>match(f.name) || match(f.code)).forEach(f=>push('room', f.id));
    STAFF.filter(p=>match(p.name)).forEach(p=>push('crew', p.id));
    SHOWS.filter(sh=>match(sh.name)).forEach(sh=>push('show', sh.id));
    DEPARTMENTS.filter(dp=>match(dp.name)).forEach(dp=>push('dept', dp.id));
  }
  return out.slice(0, 8);
}

let suggestItems = [], suggestIdx = 0;
function renderSuggest(){
  const box = $('#searchSuggest');
  suggestItems = suggestFor($('#search').value);
  if (!suggestItems.length || !document.activeElement || document.activeElement.id!=='search'){
    closeSuggest(); return;
  }
  if (suggestIdx >= suggestItems.length) suggestIdx = 0;
  box.innerHTML = suggestItems.map((t,i)=>`
    <button class="suggest__item ${i===suggestIdx?'is-active':''}" data-si="${i}">
      <span class="suggest__k">${TOKEN_KIND[t.type]}</span>
      <span class="suggest__v">${esc(tokenLabel(t))}</span>
    </button>`).join('');
  box.classList.add('is-open');
  $$('[data-si]').forEach(el=> el.onmousedown = e=>{
    e.preventDefault();
    addToken(suggestItems[Number(el.dataset.si)]);
  });
}
const closeSuggest = ()=> $('#searchSuggest').classList.remove('is-open');

/* A stable hue per person, so the same monogram is the same colour
   everywhere it appears. */
/* A monogram colour is picked from the same eight hues the show palette
   uses, not from anywhere on the wheel — a hash across all 360 puts a
   neon lime beside a clay bar sooner or later. */
const MONO_HUES = [24, 212, 74, 340, 168, 268, 42, 205];
function personHue(id){
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % 9973;
  return MONO_HUES[h % MONO_HUES.length];
}
function monoHtml(staffId, label){
  if (!staffId) return `<span class="mono mono--open"><span class="mono__i">?</span><span class="mono__n">${esc(label||'Open')}</span></span>`;

  return `<span class="mono" style="--h:${personHue(staffId)}">
    <span class="mono__i">${esc(initials(p.name))}</span>

}
const hcRow = (k,v)=> `<div class="hovercard__row"><span class="hovercard__k">${k}</span><span class="hovercard__v">${v}</span></div>`;
function hcFlags(issues){

/* Hovering a name in the left column: the two numbers a coordinator is

function hoverStaffHtml(p){

      ${b && b.wo ? hcRow('Work order', `#${b.wo}`) : ''}

    ${b && b.notes ? `<div class="hovercard__notes">${esc(b.notes)}</div>` : ''}

function showHoverFor(el){
  const bId = el.dataset.booking, sId = el.dataset.shift, pId = el.dataset.staffname;
  const b = bId ? booking(bId) : null;
  const sh = sId ? SHIFTS.find(x=>x.id===sId) : null;
  const p = pId ? person(pId) : null;
  if (!b && !sh && !p) return;
  hovercard.innerHTML = b ? hoverBookingHtml(b) : sh ? hoverShiftHtml(sh) : hoverStaffHtml(p);
  hovercard.style.visibility = 'hidden';
  hovercard.classList.add('is-visible');

  const r = el.getBoundingClientRect();
  const h = hovercard.offsetHeight, w = hovercard.offsetWidth, pad = 10;
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 8);
  let left = r.left;
  if (left + w > window.innerWidth - pad) left = window.innerWidth - w - pad;
  hovercard.style.top = top+'px';
  hovercard.style.left = Math.max(pad,left)+'px';
  hovercard.style.visibility = '';
  hoverFor = el;
}
function hideHover(){
  clearTimeout(hoverTimer);
  hoverTimer = null; hoverFor = null;
  hovercard.classList.remove('is-visible');
}
/* Touch browsers synthesise mouseover on tap, which would leave a card
   stranded under the finger — hover cards are for pointers only. */
const finePointer = ()=> !(window.matchMedia && window.matchMedia('(hover: none)').matches);
document.addEventListener('focusin', e=>{
  const el = e.target.closest('[data-staffname]');
  if (el) showHoverFor(el);
});
document.addEventListener('focusout', e=>{
  if (e.target.closest('[data-staffname]')) hideHover();
});
document.addEventListener('mouseover', e=>{
  if (!finePointer()) return;
  const el = e.target.closest('[data-booking],[data-shift],[data-staffname]');
  if (!el){ if (hoverFor && !e.target.closest('.hovercard')) hideHover(); return; }
  if (el===hoverFor) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(()=>showHoverFor(el), 140);
});
document.addEventListener('mouseout', e=>{
  const el = e.target.closest('[data-booking],[data-shift]');
  if (el && el===hoverFor && !el.contains(e.relatedTarget)) hideHover();
});
['dragstart','mousedown','wheel','keydown'].forEach(ev=>
  document.addEventListener(ev, hideHover, { capture:true, passive:true }));
$$('.paneScroll').forEach(el=> el.addEventListener('scroll', hideHover, { passive:true }));

}

function paletteMatches(q){
  const all = paletteSources();
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(q.trim()) ? q.trim() : null;
  const dated = iso ? [{ sec:'Date', label:`Go to ${shortDay(iso)}`, hint:iso, run:()=>{
    closePalette();
    state.weekStart = mondayOf(iso); state.focusDay = iso;
    setPage('roster'); render();
  }}] : [];
  if (!q.trim()) return [...dated, ...all.filter(i=>i.sec==='View'||i.sec==='Action').slice(0,8)];
  const t = q.trim().toLowerCase();
  const scored = all
    .map(i=>{
      const l = i.label.toLowerCase();
      const at = l.indexOf(t);
      if (at<0) return null;
      return { i, score: (at===0?0:1) + (i.sec==='On the roster'?2:0) };
    })
    .filter(Boolean)
    .sort((a,b)=>a.score-b.score)
    .map(x=>x.i);
  return [...dated, ...scored].slice(0, 24);
}

function renderPalette(){
  const list = $('#paletteList');
  paletteItems = paletteMatches($('#paletteInput').value);
  if (paletteIdx >= paletteItems.length) paletteIdx = 0;
  if (!paletteItems.length){
    list.innerHTML = `<div class="palette__empty">Nothing matches that.</div>`;
    return;

  let html = '', sec = null;

    if (it.sec!==sec){ sec = it.sec; html += `<div class="palette__sec">${sec}</div>`; }
    html += `<button class="palette__item ${i===paletteIdx?'is-active':''}" data-pi="${i}" ${it.colour?`style="--c:${it.colour}"`:''}>

  const active = list.querySelector('.is-active');
  if (active && active.scrollIntoView) active.scrollIntoView({ block:'nearest' });
  $$('[data-pi]').forEach(el=> el.onclick = ()=> paletteItems[Number(el.dataset.pi)].run());
}

/* ---------- printed sheets ----------
   The daily studio schedule follows PMG_STUDIODAILY.RPT field for field:
   one work order per page, the header block, then Studio, TX/Record and
   Personnel. Personnel sorts by position name, not by call time, which
   is what ScheduALL does and what people scan for on the wall. */

const printedStamp = ()=>{
  const n = new Date();
  const p = x => String(x).padStart(2,'0');
  return `${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
};
const longDate = iso =>{
  const d = toDate(iso);
  return `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}, ${d.getFullYear()}`;

/* ---------- a crew member's month ----------
   The question crew actually ask is "what am I on next month", so this
   is one person, one month, every call in date order, with the hours
   totalled the way payroll reads them. */
function monthRange(anchorIso){
  const d = toDate(anchorIso);
  const first = toIso(new Date(d.getFullYear(), d.getMonth(), 1));
  const last  = toIso(new Date(d.getFullYear(), d.getMonth()+1, 0));
  return { first, last, label:`${MONTHS[d.getMonth()]} ${d.getFullYear()}` };
}
function crewMonthShifts(staffId, anchorIso){
  const { first, last } = monthRange(anchorIso);
  return SHIFTS.filter(s=>s.staffId===staffId && s.date>=first && s.date<=last)
    .sort((a,b)=> a.date.localeCompare(b.date) || mins(a.start)-mins(b.start));
}

/* ---------- calendar feed ----------
   An .ics file is the one format Google, Apple and Outlook all take
   without an integration. Downloading it is a snapshot; the same
   builder serves the subscription URL once the backend is up, which is
   what makes a crew member's calendar update by itself. */
function icsStamp(iso, hhmm){
  return `${iso.replace(/-/g,'')}T${hhmm.replace(':','')}00`;
}
function icsEscape(t){
  return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
/* Folded at 75 octets per RFC 5545 — Google is strict about long lines. */
function icsFold(line){
  if (line.length <= 74) return line;
  const out = [line.slice(0,74)];
  let rest = line.slice(74);
  while (rest.length > 73){ out.push(' '+rest.slice(0,73)); rest = rest.slice(73); }
  if (rest) out.push(' '+rest);
  return out.join('\r\n');
}
function crewIcs(staffId, anchorIso){
  const p = person(staffId);
  const list = crewMonthShifts(staffId, anchorIso);
  const { label } = monthRange(anchorIso);
  const now = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';

  const events = list.map(s=>{
    const b = s.bookingId ? booking(s.bookingId) : null;
    /* A shift that wraps past midnight ends on the following date. */
    const endDate = mins(s.end) <= mins(s.start) ? addDays(s.date,1) : s.date;
    const where = b ? b.facilityIds.map(f=>facility(f).name).join(', ') : '';
    const desc = [
      b ? `${b.name} · ${b.start}–${b.end}` : '',
      b && b.wo ? `Work order #${b.wo}` : '',
      b && b.jobDetails ? b.jobDetails : '',
      b && b.notes ? b.notes : '',
      s.note ? `Note: ${s.note}` : '',
      s.status==='draft' ? 'DRAFT — not yet published' : '',
    ].filter(Boolean).join('\n');
    return [
      'BEGIN:VEVENT',
      `UID:${s.id}@tally.dazn`,
      `DTSTAMP:${now}`,
      `DTSTART;TZID=Australia/Sydney:${icsStamp(s.date, s.start)}`,
      `DTEND;TZID=Australia/Sydney:${icsStamp(endDate, s.end)}`,
      icsFold(`SUMMARY:${icsEscape(`${role(s.roleId).name} — ${b?b.name:'Booking'}`)}`),
      icsFold(`LOCATION:${icsEscape(where)}`),
      icsFold(`DESCRIPTION:${icsEscape(desc)}`),
      `STATUS:${s.status==='draft'?'TENTATIVE':'CONFIRMED'}`,
      'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY',
      icsFold(`DESCRIPTION:${icsEscape(`Call in 2 hours — ${b?b.name:'shift'}`)}`),
      'END:VALARM',
      'END:VEVENT',
    ].join('\r\n');
  });

  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DAZN//Tally Roster//EN',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH',
    icsFold(`X-WR-CALNAME:${icsEscape(`${p.name} — roster ${label}`)}`),
    'X-WR-TIMEZONE:Australia/Sydney',
    /* Sydney's rules, so the times hold across the October changeover. */
    'BEGIN:VTIMEZONE','TZID:Australia/Sydney',
    'BEGIN:STANDARD','DTSTART:19700405T030000',
    'RRULE:FREQ=YEARLY;BYMONTH=4;BYDAY=1SU','TZOFFSETFROM:+1100','TZOFFSETTO:+1000','TZNAME:AEST','END:STANDARD',
    'BEGIN:DAYLIGHT','DTSTART:19701004T020000',
    'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=1SU','TZOFFSETFROM:+1000','TZOFFSETTO:+1100','TZNAME:AEDT','END:DAYLIGHT',
    'END:VTIMEZONE',
    ...events,
    'END:VCALENDAR',
  ].join('\r\n');
}

function downloadFile(name, text, type){
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function downloadCrewIcs(staffId, anchorIso){
  const p = person(staffId);
  const { label } = monthRange(anchorIso);
  downloadFile(`${p.name.replace(/\s+/g,'-').toLowerCase()}-${label.replace(' ','-').toLowerCase()}.ics`,
    crewIcs(staffId, anchorIso), 'text/calendar;charset=utf-8');
  toast(`${p.name}'s ${label} downloaded — import it into Google Calendar.`);
}

/* The URL the backend will serve. Read-only here: it is shown so the
   shape is agreed before anyone builds it, and so the copy button on
   the export panel has something real to hand out later. */
const feedUrl = staffId => `webcal://roster.dazn.internal/crew/${staffId}/roster.ics`;

/* ---------- how the live sync is meant to work ----------
   Two ways to get a roster into someone's calendar, and they are not
   equivalent:

   1. Subscription feed (what feedUrl points at). The backend serves
      crewIcs() at a per-person URL carrying an unguessable token, and
      the crew member subscribes once. No Google account access, no
      OAuth screen, nothing to revoke when someone leaves beyond killing
      the token. The catch is that Google decides when to poll a
      subscribed URL — in practice somewhere between one and twenty-four
      hours — so a call time that moves on the morning of a shift may not
      reach the phone in time. Fine for the shape of the month, not
      enough on its own for same-day changes.

   2. Calendar API push (what "real time" actually needs). The crew
      member connects their Google account once; we hold a refresh token
      and write events into a dedicated secondary calendar with
      events.insert/patch, keyed by the shift id so an edit updates the
      event rather than duplicating it. Changes land in seconds. The cost
      is OAuth verification, token storage, per-user revocation, and
      handling the case where someone edits the event on their side.

   The sensible build order is 1 then 2: the feed needs no consent flow
   and covers the planning horizon, and it uses the same crewIcs()
   builder the download button already uses, so the backend has one
   serialiser to test. Push sync then only has to carry same-day moves.

   Either way the shift, not the booking, is the unit: publish state
   gates what is sent, so draft shifts stay out of a crew member's
   calendar until a coordinator publishes them. */

/* ============================================================
   13d. SESSION
   Coming back should put you where you left, not on today at the top
   with nothing selected. Only view state is kept — never roster data,
   which belongs to the backend.
   ============================================================ */
const SESSION_KEY = 'tally.session.v1';
/* Storage is unavailable in some embedded contexts and in private
   windows, and a roster that throws on load is worse than one that
   forgets where you were — so every access is guarded and silent. */
function readSession(){
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
  catch (e){ return null; }
}
function writeSession(){
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      view: state.view, weekStart: state.weekStart, focusDay: state.focusDay,
      compact: state.compact, deptFilter: state.deptFilter,
      tokens: state.tokens, search: state.search,
      theme: document.documentElement.dataset.theme,
      topH: $('#workspace').style.getPropertyValue('--top-h'),
      laneMode: state.laneMode,
      sel: state.sel && state.sel.id ? { kind:state.sel.kind, id:state.sel.id } : null,
      facScroll: $('#facScroll').scrollTop, crewScroll: $('#crewScroll').scrollTop,
      xScroll: $('#facScroll').scrollLeft,
    }));
  } catch (e){ /* nothing to do — the session just won't persist */ }
}
let sessionTimer;
const saveSession = ()=>{ clearTimeout(sessionTimer); sessionTimer = setTimeout(writeSession, 400); };

function restoreSession(){
  const v = readSession();
  if (!v) return;
  if (v.theme) document.documentElement.dataset.theme = v.theme;
  if (v.view) state.view = v.view;
  if (v.weekStart) state.weekStart = v.weekStart;
  if (v.focusDay) state.focusDay = v.focusDay;
  if (v.deptFilter) state.deptFilter = v.deptFilter;
  state.compact = !!v.compact;
  state.tokens = Array.isArray(v.tokens) ? v.tokens : [];
  state.search = v.search || '';
  $('#app').classList.toggle('is-compact', state.compact);
  $('#app').classList.toggle('is-month-view', state.view==='month');
  ['week','day','month'].forEach(x=>
    $('#view'+x[0].toUpperCase()+x.slice(1)).setAttribute('aria-pressed', state.view===x));
  if (v.topH) $('#workspace').style.setProperty('--top-h', v.topH);
  if (v.laneMode) setLayoutMode(v.laneMode);
  $('#search').value = state.search;
  renderTokens();

  render();

  /* Scroll and selection after the grid exists, and only if what was
     selected is still there — an id from a previous session may have
     been deleted since. */
  requestAnimationFrame(()=>{
    if (v.facScroll) $('#facScroll').scrollTop = v.facScroll;
    if (v.crewScroll) $('#crewScroll').scrollTop = v.crewScroll;
    if (v.xScroll){ $('#facScroll').scrollLeft = v.xScroll; $('#crewScroll').scrollLeft = v.xScroll; }
    if (v.sel){
      const live = v.sel.kind==='booking' ? booking(v.sel.id) : byId(SHIFTS, v.sel.id);
      if (live) select(v.sel.kind, v.sel.id);
    }
  });
}

['scroll','click','keyup'].forEach(ev=>
  document.addEventListener(ev, saveSession, { capture:true, passive:true }));

/* ============================================================
   13e. PERSISTENCE
   The roster data itself — everything SESSION above deliberately
   leaves out. One snapshot document, last-write-wins: good enough for
   a single coordinator at a time, not yet safe for two people editing
   the same booking simultaneously (that needs real-time sync, which
   is a deliberate next step, not an oversight).
   ============================================================ */
function snapshotState(){
  return {
    staff: STAFF, shows: SHOWS, bookings: BOOKINGS, shifts: SHIFTS, offdays: OFFDAYS,
    seq: { STAFF_SEQ, SHOW_SEQ, POS_SEQ, BK_SEQ, SH_SEQ, OFF_SEQ },
  };
}
function applyState(data){
  if (Array.isArray(data.staff)) STAFF = data.staff;
  if (Array.isArray(data.shows)) SHOWS = data.shows;
  if (Array.isArray(data.bookings)) BOOKINGS = data.bookings;
  if (Array.isArray(data.shifts)) SHIFTS = data.shifts;
  if (Array.isArray(data.offdays)) OFFDAYS = data.offdays;
  const seq = data.seq || {};
  if (seq.STAFF_SEQ != null) STAFF_SEQ = seq.STAFF_SEQ;
  if (seq.SHOW_SEQ != null) SHOW_SEQ = seq.SHOW_SEQ;
  if (seq.POS_SEQ != null) POS_SEQ = seq.POS_SEQ;
  if (seq.BK_SEQ != null) BK_SEQ = seq.BK_SEQ;
  if (seq.SH_SEQ != null) SH_SEQ = seq.SH_SEQ;
  if (seq.OFF_SEQ != null) OFF_SEQ = seq.OFF_SEQ;
}

let lastPersistedJson = null;
/* Blocks any write until the initial load has resolved one way or the
   other — otherwise an early check against this file's baked-in demo
   data could clobber real Firestore data with stale demo data before
   the load even comes back. */
let persistenceReady = false;
let persisting = false;
/* Data mutations happen across a couple dozen call sites and several
   separate modal-specific render functions (renderCrewModal,
   renderShowEditor, ...), not one central place — rather than chase
   every call site, this polls the actual state and only writes when
   something really changed, which is simpler and can't miss a spot. */
async function checkAndPersist(){
  if (!persistenceReady || persisting) return;
  const json = JSON.stringify(snapshotState());
  if (json === lastPersistedJson) return;
  persisting = true;
  try {
    await setDoc(rosterDocRef, JSON.parse(json));
    lastPersistedJson = json;
  } catch (e){ console.error('Roster save failed', e); }
  finally { persisting = false; }
}
setInterval(checkAndPersist, 1500);
window.addEventListener('beforeunload', ()=>{
  if (persistenceReady && JSON.stringify(snapshotState()) !== lastPersistedJson) checkAndPersist();
});

/* Firestore rules require request.auth != null, so this has to resolve
   before the first read — silent and invisible, no login screen, just
   enough to keep the roster off the open internet. */
async function ensureAuth(){
  await signInAnonymously(auth);
}

async function loadFromFirestore(){
  try {
    const snap = await getDoc(rosterDocRef);
    if (snap.exists()){
      applyState(snap.data());
      lastPersistedJson = JSON.stringify(snapshotState());
      render();
    } else {
      /* First run for this project — seed Firestore from the demo
         data this file already ships with, so there's something to
         load next time instead of an empty roster. */
      const json = JSON.stringify(snapshotState());
      await setDoc(rosterDocRef, JSON.parse(json));
      lastPersistedJson = json;
    }
    /* Only allow writes once we actually know what's in Firestore —
       a failed read below leaves this false, so a transient network
       error doesn't lead to blindly overwriting real data with
       whatever demo/stale state happens to be sitting in memory. */
    persistenceReady = true;
  } catch (e){
    console.error('Roster load failed — showing local demo data, changes will not be saved this session', e);
  }
}

/* ============================================================
   14. BOOT
   ============================================================ */
$('#deptSelect').innerHTML = `<option value="all">All departments</option>` +
  DEPARTMENTS.map(d=>`<option value="${d.id}" ${d.id===state.deptFilter?'selected':''}>${d.name}</option>`).join('');

/* Follow the system's appearance on a first visit; the toggle in the
   head overrides it from then on and that choice is what's remembered. */
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches && !readSession())
  document.documentElement.dataset.theme = 'light';

render();
restoreSession();
$('#deptSelect').value = state.deptFilter;
ensureAuth().then(loadFromFirestore).catch(e=>console.error('Roster auth failed — showing local demo data, changes will not be saved this session', e));
</script>
</body>
