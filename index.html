/* ============================================================
   5. CHECKS
   Pure functions of the current data, so the same code can run
   server-side too, so the same rules apply wherever a shift is created.
   ============================================================ */
/* The checks run over the whole season, not just the visible week, so
   they are driven off three indexes rebuilt once per pass rather than
   rescanning every booking and shift for every booking and shift. */
let IDX = null;
function buildIndex(){
  const byDate = new Map(), byStaff = new Map(), byBooking = new Map(), weekH = new Map();
  const push = (map, key, v)=>{ const a = map.get(key); if (a) a.push(v); else map.set(key,[v]); };
  for (const b of BOOKINGS) push(byDate, b.date, b);
  for (const s of SHIFTS){
    if (s.bookingId) push(byBooking, s.bookingId, s);
    if (!s.staffId) continue;
    push(byStaff, s.staffId, s);
    const k = s.staffId+'|'+mondayOf(s.date);
    weekH.set(k, (weekH.get(k)||0) + durH(s));
  }
  IDX = { byDate, byStaff, byBooking, weekH };
}
const invalidateIndex = ()=>{ IDX = null; };
function idx(){ if (!IDX) buildIndex(); return IDX; }
const shiftsFor = id => idx().byBooking.get(id) || [];

function bookingConflicts(b){
  const out = [];
  for (const o of idx().byDate.get(b.date) || []){
    if (o.id===b.id) continue;
    const shared = o.facilityIds.filter(f=>b.facilityIds.includes(f));
    if (shared.length && overlaps(b,o)){
      out.push({ level:'hard', type:'facility',
        title:`${facility(shared[0]).name} is double-booked`,
        detail:`${o.name} holds it ${o.start}–${o.end}.` });
    }
  }
  const open = shiftsFor(b.id).filter(s=>!s.staffId).length;
  if (open) out.push({ level:'soft', type:'crewing',
    title:`${open} position${open===1?'':'s'} unfilled`, detail:'Assign crew before this goes out.' });
  if (!b.facilityIds.length) out.push({ level:'soft', type:'nofac',
    title:'No facility assigned', detail:'This booking won\u2019t appear on the facility schedule.' });
  return out;
}

function shiftConflicts(sh){
  const out = [];
  if (!sh.staffId) return out;
  const p = person(sh.staffId);
  const me = span(sh);
  for (const o of idx().byStaff.get(sh.staffId) || []){
    if (o.id===sh.id) continue;
    const os = span(o);
    if (me.s<os.e && os.s<me.e){
      const b = o.bookingId?booking(o.bookingId):null;
      out.push({ level:'hard', type:'overlap', title:'Double-booked',
        detail:`Also on ${o.start}–${o.end}${b?` for ${b.name}`:''}.` });
    } else {
      const gap = me.s>=os.e ? (me.s-os.e)/60 : (os.s-me.e)/60;
      if (gap>=0 && gap<RULES.minTurnaroundHours){
        out.push({ level:'soft', type:'turnaround', title:`${fmtDur(gap)} between shifts`,
          detail:`Under the ${RULES.minTurnaroundHours}-hour break.` });
      }
    }
  }
  const d = durH(sh);
  if (d>RULES.maxShiftHours) out.push({ level:'soft', type:'long', title:`${fmtDur(d)} shift`,
    detail:`Over the ${RULES.maxShiftHours}-hour limit.` });
  if (!hasRole(p, sh.roleId)) out.push({ level:'hard', type:'skill',
    title:`Not signed off on ${role(sh.roleId).name}`,
    detail:`${p.name.split(' ')[0]} isn\u2019t cleared for this position.` });
  const wk = weekHours(sh.staffId, mondayOf(sh.date));
  if (wk>RULES.maxWeekHours) out.push({ level:'soft', type:'weekly',
    title:`${Math.round(wk)} hours this week`, detail:`Over the ${RULES.maxWeekHours}-hour week.` });

  if (isFullTime(p)){
    const day = dayHours(sh.staffId, sh.date);
    if (sh.rdo) out.push({ level:'soft', type:'ot-day',
      title:`${fmtDur(day)} overtime`,
      detail:`Worked on a rostered day off, so the whole day counts.` });
    else if (day > OT.dayStd + 0.01) out.push({ level:'soft', type:'ot-day',
      title:`${fmtDur(day - OT.dayStd)} overtime`,
      detail:`${fmtDur(day)} on this day, past the ${OT.dayStd}-hour standard.` });

    const shape = weekShape(sh.staffId, mondayOf(sh.date));
    if (shape.band === 'over') out.push({ level:'soft', type:'ot-week',
      title:`${fmtDur(shape.over)} over the week`,
      detail:`${fmtDur(shape.hours)} rostered — past ${OT.weekReasonable}h reasonable additional.` });
    else if (shape.band === 'extra') out.push({ level:'soft', type:'ot-week',
      title:`${fmtDur(shape.hours)} this week`,
      detail:`Into reasonable additional hours, over the ${OT.weekStd}-hour standard.` });

    if (shape.rdoOwed) out.push({ level:'soft', type:'rdo',
      title:`${shape.rdoOwed} rostered day off owed`,
      detail:`${shape.worked} days worked — a full-time week owes ${OT.rdoPerWeek} off.` });
    if (sh.rdo) out.push({ level:'soft', type:'rdo-worked', title:'Worked on a rostered day off',
      detail:'The day is owed back and the hours count as overtime.' });
    else if (offOn(sh.staffId, sh.date)) out.push({ level:'soft', type:'rdo-clash',
      title:'Falls on a marked day off',
      detail:'Mark the shift as worked on a rostered day off, or move the day.' });
  }
  return out;
}

/* ---------- overtime and rostered days off ----------
   Four separate things get called "overtime" in a studio, so they are
   each named and counted separately rather than rolled into one number:

     daily      anything past 8 hours on a single day
     weekly     38 is standard, up to 40 is reasonable additional,
                past 40 is overtime
     monthly    152 standard, up to 162 reasonable, past 162 overtime
     RDO        a full-time roster owes two days off a week; a sixth day
                worked is a day off taken back

   Only full-time crew are measured against these. Freelancers are
   engaged per shift and have no roster to be owed against. */
const OT = {
  dayStd: 8,
  weekStd: 38, weekReasonable: 40,
  monthStd: 152, monthReasonable: 162,
  rdoPerWeek: 2,
};
const isFullTime = p => p && p.employment === 'fulltime';

/* Standard / additional / overtime, from a figure and its two marks. */
function band(hours, std, reasonable){
  if (hours > reasonable) return 'over';
  if (hours > std) return 'extra';
  return 'std';
}
const BAND_WORD = { std:'within standard', extra:'reasonable additional', over:'overtime' };

function dayHours(staffId, date){
  return (idx().byStaff.get(staffId) || [])
    .reduce((t,s)=> s.date===date ? t + durH(s) : t, 0);
}

/* Every day in a range where this person worked past eight hours, with
   the excess. This is the list a coordinator is asked to justify. */
/* A rostered day off is a record on the roster, not the absence of one.
   Marking them is how a coordinator publishes "these are your days
   this week", and it gives anything landing on that day something to
   contradict. Nine to five, since that is the day being given up. */
let OFFDAYS = [], OFF_SEQ = 0;
const RDO_START = '09:00', RDO_END = '17:00';
const newOffId = ()=> 'off'+String(++OFF_SEQ).padStart(4,'0');
const offOn = (staffId, date)=> OFFDAYS.find(o=>o.staffId===staffId && o.date===date);
const offsInWeek = (staffId, weekStart)=>{
  const end = addDays(weekStart, 6);
  return OFFDAYS.filter(o=>o.staffId===staffId && o.date>=weekStart && o.date<=end);
};

/* Overtime falls out of a day two ways, and a day can only be counted
   once. A day worked on a rostered day off is overtime end to end —
   they should not have been there at all — so the whole day counts, not
   just the part past eight hours. Every other day counts the excess. */
function otDays(staffId, from, to){
  const byDate = new Map();
  for (const s of idx().byStaff.get(staffId) || []){
    if (s.date < from || s.date > to) continue;
    const day = byDate.get(s.date) || { worked:0, rdo:false };
    day.worked += durH(s);
    if (s.rdo) day.rdo = true;
    byDate.set(s.date, day);
  }
  return [...byDate.entries()]
    .map(([date, day]) => day.rdo
      ? { date, worked:day.worked, over:day.worked, kind:'rdo' }
      : { date, worked:day.worked, over:day.worked - OT.dayStd, kind:'day' })
    .filter(x => x.over > 0.01)
    .sort((a, b) => a.date.localeCompare(b.date));
}
const OT_REASON = { rdo:'worked on a day off', day:`past ${OT.dayStd}h` };

/* Overtime since the season opened, counted to the end of the week on
   screen rather than to today. Every other figure in the panel covers
   the displayed week, so stopping this one at today made a day later in
   that same week count towards the week and not the season — two
   correct numbers that read as a contradiction. */
function otSeason(staffId, upTo){
  const to = upTo || addDays(state.weekStart, 6);
  const days = otDays(staffId, SEASON.start, to);
  return {
    hours: days.reduce((t, d) => t + d.over, 0),
    days: days.length,
    to,
  };
}

/* A week's shape for one person: hours against both marks, which days
   were worked, and what the roster owes them in days off. */
function weekShape(staffId, weekStart){
  const p = person(staffId);
  const end = addDays(weekStart, 6);
  const dates = new Set();
  let rdoWorked = 0;
  for (const s of idx().byStaff.get(staffId) || []){
    if (s.date < weekStart || s.date > end) continue;
    dates.add(s.date);
    if (s.rdo) rdoWorked++;
  }
  const worked = dates.size;
  const hours = weekHours(staffId, weekStart);
  const full = isFullTime(p);
  /* Six days worked is one day off taken back, seven is two. The flag
     on a shift records which day it was; this is the count regardless. */
  const rdoOwed = full ? Math.max(0, worked - (7 - OT.rdoPerWeek)) : 0;
  const marked = offsInWeek(staffId, weekStart).length;
  return {
    hours, worked, rdoOwed, rdoWorked, marked,
    daysOff: 7 - worked,
    band: full ? band(hours, OT.weekStd, OT.weekReasonable) : 'std',
    over: Math.max(0, hours - OT.weekReasonable),
    full,
  };
}

function monthShape(staffId, weekStart){
  const p = person(staffId);
  const hours = monthHours(staffId, weekStart);
  const full = isFullTime(p);
  return {
    hours,
    band: full ? band(hours, OT.monthStd, OT.monthReasonable) : 'std',
    over: Math.max(0, hours - OT.monthReasonable),
    full,
  };
}

function weekHours(staffId, weekStart){
  const I = idx(), k = staffId+'|'+weekStart;
  if (I.weekH.has(k)) return I.weekH.get(k);
  const end = addDays(weekStart, 6);
  return (I.byStaff.get(staffId) || [])
    .reduce((t,s)=> (s.date>=weekStart && s.date<=end) ? t+durH(s) : t, 0);
}

/* "This month" is the trailing 30 days ending on the last day of the
   displayed week, not a strict calendar month — a strict month broke
   whenever the visible week crossed a month boundary (a week running
   Aug 31–Sep 6 would count only that one Monday toward "August" while
   the rest counted toward the week total, so the month figure could
   come out smaller than the week figure it's meant to contain). This
   window always fully contains the displayed week, so the month total
   can never read lower than the week total. */
function monthHours(staffId, weekStart){
  const windowEnd = addDays(weekStart, 6), windowStart = addDays(windowEnd, -29);
  return (idx().byStaff.get(staffId) || [])
    .reduce((t,s)=> (s.date>=windowStart && s.date<=windowEnd) ? t+durH(s) : t, 0);
}

/* Shared by the week grid and the day timeline so both report hours
   the same way — always labelled, never a bare number. */
/* One line: hours against the standard week, banded, with the days off
   owed sitting beside it. Both are the things that decide whether this
   person can take another shift. */
function hoursLine(p){
  const w = weekShape(p.id, state.weekStart);
  const mark = w.band==='over' ? 'OT' : w.band==='extra' ? 'Extra' : '';
  return `<span class="hoursrow band-${w.band}">
      <span class="hoursrow__h">${fmtH(w.hours)}</span>
      <span class="hoursrow__of">of ${w.full?OT.weekStd:p.contract}h</span>
      ${mark?`<span class="hoursrow__m">${mark}</span>`:''}
      ${w.rdoOwed?`<span class="rdoflag">${w.rdoOwed} RDO owed</span>`:''}
      ${!w.rdoOwed && w.full && w.marked?`<span class="offflag">${w.marked} off</span>`:''}
    </span>`;
}

let C_BOOK = new Map(), C_SHIFT = new Map();
/* A season's worth of bookings is more than the screen ever asks
   about, so the pass covers the visible range plus two days either
   side — enough for a turnaround check to see the shift before and
   after the window. Anything outside is checked on demand. */
function rebuildChecks(){
  invalidateIndex(); buildIndex();
  C_BOOK = new Map(); C_SHIFT = new Map();
  const days = activeDays();
  const from = addDays(days[0], -2), to = addDays(days[days.length-1], 2);
  for (const b of BOOKINGS){
    if (b.date<from || b.date>to) continue;
    const c = bookingConflicts(b); if (c.length) C_BOOK.set(b.id, c);
  }
  for (const s of SHIFTS){
    if (s.date<from || s.date>to) continue;
    const c = shiftConflicts(s); if (c.length) C_SHIFT.set(s.id, c);
  }
}
const bkIssues = id=> C_BOOK.get(id) || [];
const shIssues = id=> C_SHIFT.get(id) || [];
const levelOf = list=> list.length ? (list.some(c=>c.level==='hard')?'hard':'soft') : null;

/* ============================================================
   6. STATE
   ============================================================ */
const state = {
  page:'roster',        // roster | shows
  today:'2026-09-01',
  weekStart: mondayOf('2026-09-01'),
  focusDay:'2026-09-01',
  view:'week',
  search:'',
  deptFilter:'all',
  collapsed:new Set(),
  sel:null,
  compact:false,
  showSel:null,          // a show id, 'new', or null (library view)
  showDraft:null,        // working copy of the open show; saved on demand
  showScope:'future',    // which bookings a saved show edit is pushed to
  crewOpen:false,
  crewSel:null,           // a staff id, 'new', or null (list view) within the modal
  crewDraft:null,
  crewSearch:'',
  exportMonth:null,       // which month the roster export panel is showing
  tokens:[],              // the filter pills sitting in the search field
  crewDeptFilter:'all',
  crewEmpFilter:'all',
  crewRoleFilter:'all',
  crewOverOnly:false,
  laneMode:'half',       // 'fac' | 'half' | 'crew' — which of the two workspace panes show
};

/* ============================================================
   7. RENDER
   ============================================================ */
const facGrid = $('#facGrid'), crewGrid = $('#crewGrid');
const facScroll = $('#facScroll'), crewScroll = $('#crewScroll');

const weekDays = ()=> Array.from({length:7},(_,i)=>addDays(state.weekStart,i));
/* A week spanning a month boundary is ambiguous about "which month" —
   resolve it the same way monthHours() avoids the same trap: don't
   trust the Monday alone, use the middle of the visible week so the
   month with most of the week's days wins. */
function monthAnchor(){ return toDate(addDays(state.weekStart, 3)); }
function monthDays(){
  const d = monthAnchor();
  const y = d.getFullYear(), m = d.getMonth();
  const count = new Date(y, m+1, 0).getDate();
  return Array.from({length:count}, (_,i)=> toIso(new Date(y, m, i+1)));
}
const activeDays = ()=> state.view==='day' ? [state.focusDay] : state.view==='month' ? monthDays() : weekDays();

function hit(text){
  const q = state.search.trim().toLowerCase();
  return !q || text.toLowerCase().includes(q);
}
/* Every pill in the search field has to pass, and free text on top of
   them. Two pills of the same kind read as "either" — three rooms means
   any of those three — which is how people expect a filter list to
   behave. */
function tokensPassBooking(b){
  const rooms = tokensOf('room'), crews = tokensOf('crew'), shows = tokensOf('show');
  const flags = tokensOf('flag');
  if (flags.includes('problems') && !bkIssues(b.id).length) return false;
  if (flags.includes('unfilled') && !shiftsFor(b.id).some(s=>!s.staffId)) return false;
  if (rooms.length && !rooms.some(f=>b.facilityIds.includes(f))) return false;
  if (shows.length && !shows.includes(b.showId)) return false;
  if (crews.length && !shiftsFor(b.id).some(s=>crews.includes(s.staffId))) return false;
  return true;
}
function bookingVisible(b){
  if (!tokensPassBooking(b)) return false;
  return hit(b.name+' '+b.client);
}
function shiftVisible(s){
  const flags = tokensOf('flag'), crews = tokensOf('crew'), depts = tokensOf('dept');
  if (flags.includes('problems') && !shIssues(s.id).length) return false;
  if (flags.includes('unfilled') && s.staffId) return false;
  if (crews.length && !crews.includes(s.staffId)) return false;
  if (depts.length && !depts.includes(role(s.roleId).dept)) return false;
  const b = s.bookingId?booking(s.bookingId):null;
  if (b && !tokensPassBooking(b)) return false;
  if (!b && (tokensOf('room').length || tokensOf('show').length)) return false;
  return hit((b?b.name:'')+' '+role(s.roleId).name+' '+(s.staffId?person(s.staffId).name:''));
}

/* The now-line is drawn from the wall clock, not from the roster's
   own "today", so it keeps moving while the page is open. Hours after
   midnight belong to the previous day's 04:00–02:00 window. */
function nowPct(){
  const n = new Date();
  let h = n.getHours() + n.getMinutes()/60;
  if (h < TL_A) h += 24;
  return (h>=TL_A && h<=TL_B) ? tlPos(h) : null;
}
function nowClock(){
  const n = new Date();
  return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
function nowMark(date){
  if (date!==state.today) return '';
  const p = nowPct();
  return p===null ? '' : `<span class="nowline" data-nowline style="left:${p}%"></span>`;
}
function nowFlag(date){
  if (date!==state.today) return '';
  const p = nowPct();
  return p===null ? '' : `<span class="nowflag" data-nowflag style="left:${p}%">${nowClock()}</span>`;
}
/* Ticks the line across without a full re-render, so it moves even
   while you're mid-drag or reading a hover card. */
function updateNowLines(){
  const p = nowPct();
  $$('[data-nowline]').forEach(el=>{
    if (p===null) el.remove(); else el.style.left = p+'%';
  });
  $$('[data-nowflag]').forEach(el=>{
    if (p===null) el.remove();
    else { el.style.left = p+'%'; el.textContent = nowClock(); }
  });
}

/* A pane with nothing in it should say what it would take to change
   that, and offer the action, rather than leaving a blank grid. */
function emptyRow(rowClass, icon, title, sub, action){
  return `<div class="${rowClass}"><div class="emptyState">
      <span class="emptyState__icon">${icon}</span>
      <span class="emptyState__title">${title}</span>
      <span class="emptyState__sub">${sub}</span>
      ${action||''}</div></div>`;
}
const svgPrint = (n=15)=>`<svg width="${n}" height="${n}" viewBox="0 0 15 15" fill="none"><path d="M4 5.5V2h7v3.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4 10.5H2.6V6.6h9.8v3.9H11" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4 9h7v4H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
const svgEmptyCal = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="3.5" y="6.5" width="23" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 12h23M10 3.5v5M20 3.5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const svgEmptyPeople = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="12" cy="11" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M4 25c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M21 8.5a4 4 0 0 1 0 7.6M23 24.6c0-3.2-1.3-6-3.4-7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;

function dayHead(cornerHtml, subFor){
  let h = `<div class="row dayhead"><div class="corner">${cornerHtml}</div>`;
  for (const d of activeDays()){
    const dt = toDate(d), sub = subFor(d);
    h += `<div class="dayhead__cell ${d===state.today?'is-today':''}">${nowFlag(d)}
      <div class="dayhead__top">
        <span class="dayhead__dow">${DOW[dt.getDay()].slice(0,3)}</span>
        <span class="dayhead__date tnum">${String(dt.getDate()).padStart(2,'0')} ${MON[dt.getMonth()]}</span>
        <button class="dayhead__print" data-printday="${d}"
          aria-label="Print call sheet for ${DOW[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}">${svgPrint(13)}</button>
      </div>
      <div class="dayhead__sub ${sub.short?'is-short':''}">${sub.text}</div></div>`;
  }
  return h+`</div>`;
}

/* Cells are compact 22-hour timelines (04:00–02:00, the same window the
   day view uses) — a few widely-spaced ticks give a sense of the day's
   shape without cluttering a ~190px-wide column. */
/* A week cell is narrow, so it carries only the labelled marks — the
   same ones a day lane rules on, so the two views count alike. */
const CELL_TICKS = ()=> hourMarks().filter(isMajor);
function cellGrid(){
  return `<span class="cellGrid">${CELL_TICKS().map(h=>
    `<span class="${isMajor(h)?'is-major':''}" style="left:${tlPos(h)}%"></span>`).join('')}</span>`;
}

/* ---------- facilities ---------- */
function bookingBlock(b, facId){
  const issues = bkIssues(b.id), lvl = levelOf(issues);
  const crew = SHIFTS.filter(s=>s.bookingId===b.id);
  const open = crew.filter(s=>!s.staffId).length;
  const cls = ['wbar'];
  if (b.status==='pencilled') cls.push('is-pencil');
  if (state.sel && state.sel.kind==='booking' && state.sel.id===b.id) cls.push('is-selected');
  if (lvl==='hard' || issues.some(c=>c.type==='facility')) cls.push('is-hard');
  else if (lvl==='soft') cls.push('is-soft');
  const left = tlLeft(b.start), width = tlWide(b);
  const title = `${b.start}–${b.end} ${b.name}${b.client?' · '+b.client:''} — ${crew.length-open}/${crew.length} crew`;
  if (isPending(b.id)) cls.push('is-pending');
  return `<button class="${cls.join(' ')}" draggable="true" data-booking="${b.id}" data-fac="${facId}"
      style="--c:${b.colour};left:${left}%;width:${width}%" aria-label="${esc(title)}">
      <span class="grip grip--s"></span><span class="grip grip--e"></span>
      <span class="wbar__n">${esc(b.name)}</span>
      <span class="wbar__t tnum">${hhmm(b.start)}–${hhmm(b.end)}</span>
    </button>`;
}

function renderFacilities(){
  const days = activeDays();
  facGrid.style.setProperty('--days', days.length);
  const inRange = BOOKINGS.filter(b=>days.includes(b.date));

  const head = dayHead(`<span class="corner__meta">${FACILITIES.length} spaces</span>`, d=>{
    const n = BOOKINGS.filter(b=>b.date===d).length;
    const clash = BOOKINGS.filter(b=>b.date===d && bkIssues(b.id).some(c=>c.type==='facility')).length;
    return { text: clash?`${n} bookings · ${clash} clash`:`${n} booking${n===1?'':'s'}`, short: clash>0 };
  });
  let html = head;

  for (const g of FAC_GROUPS){
    const items = FACILITIES.filter(f=>f.group===g);
    const clashes = inRange.filter(b=>items.some(f=>b.facilityIds.includes(f.id)) && bkIssues(b.id).some(c=>c.type==='facility')).length;
    html += `<div class="row"><div class="grouprow grouprow--static">
        <span class="grouprow__name">${g}</span>
        ${clashes?`<span class="grouprow__warn">${svgWarn(11)} ${clashes}</span>`:''}</div></div>`;

    for (const f of items){
      const used = inRange.filter(b=>b.facilityIds.includes(f.id));
      html += `<div class="row lane"><div class="namecell">
          <span class="namecell__body"><span class="namecell__name">${f.name}</span></span></div>`;
      for (const d of days){
        const list = BOOKINGS.filter(b=>b.date===d && b.facilityIds.includes(f.id) && bookingVisible(b))
                             .sort((a,b)=>mins(a.start)-mins(b.start));
        html += `<div class="cell ${d===state.today?'is-today':''}" data-fac="${f.id}" data-date="${d}">
          ${cellGrid()}${nowMark(d)}${list.map(b=>bookingBlock(b,f.id)).join('')}
          <button class="cell__add" data-newbooking="${f.id}|${d}" aria-label="New booking in ${f.name}">${svgPlus}</button></div>`;
      }
      html += `</div>`;
    }
  }
  if (!inRange.filter(bookingVisible).length){
    html = head + emptyRow('row', svgEmptyCal,
      inRange.length ? 'Nothing matches the current filters'
                     : `Nothing booked ${state.view==='day'?'today':'this week'}`,
      inRange.length ? 'Clear the search or the problems and unfilled filters to see the rest of the schedule.'
                     : 'Every studio and control room is clear. Book one in, or generate a run from a show.',
      inRange.length
        ? `<button class="btn btn--sm" data-clearfilters>Clear filters</button>`
        : `<button class="btn btn--primary btn--sm" data-newbooking="${FACILITIES[0].id}|${days[0]}">New booking</button>`);
  }
  facGrid.innerHTML = html;
  $('#facMeta').textContent = `${inRange.length} booking${inRange.length===1?'':'s'} ${state.view==='day'?'today':'this week'}`;
}

/* ---------- crew ---------- */
function shiftBlock(s){
  const b = s.bookingId?booking(s.bookingId):null;
  const issues = shIssues(s.id).filter(c=>c.type!=='weekly');
  const lvl = levelOf(issues);
  const cls = ['wbar'];
  if (!s.staffId) cls.push('is-open');
  if (s.status==='draft') cls.push('is-pencil');
  if (state.sel && state.sel.kind==='shift' && state.sel.id===s.id) cls.push('is-selected');
  if (lvl==='hard') cls.push('is-hard');
  else if (lvl==='soft') cls.push('is-soft');

  const left = tlLeft(s.start), width = tlWide(s);
  const label = b ? b.name : role(s.roleId).name;
  const colour = b ? b.colour : '#8A8F99';

  /* A shift's own call-to-wrap window can run much longer than the
     booking it's attached to — a 10am-6am shift covering a 4-6pm show,
     say. When that happens, show the full shift as a muted span with
     the booking's actual on-air window picked out inside it. */
  let onAir = '';
  if (b && (s.start!==b.start || s.end!==b.end)){
    const outer = span(s), bk = span(b);
    const clampedS = Math.max(bk.s, outer.s), clampedE = Math.min(bk.e, outer.e);
    if (clampedE > clampedS && outer.e > outer.s){
      const onLeft = (clampedS-outer.s)/(outer.e-outer.s)*100;
      const onWidth = (clampedE-clampedS)/(outer.e-outer.s)*100;
      onAir = `<span class="wbar__on" style="left:${onLeft}%;width:${onWidth}%"></span>`;
      cls.push('has-on-air');
    }
  }

  const title = `${s.start}–${s.end} ${role(s.roleId).name}${b?` · ${b.name} (on air ${b.start}–${b.end})`:''}${s.status==='confirmed'?' · confirmed':''}`;
  if (isPending(s.id)) cls.push('is-pending');
  if (s.rdo) cls.push('is-rdo');
  return `<button class="${cls.join(' ')}" draggable="true" data-shift="${s.id}"
      style="--c:${colour};left:${left}%;width:${width}%" aria-label="${esc(title)}">
      ${onAir}
      <span class="grip grip--s"></span><span class="grip grip--e"></span>
      <span class="wbar__n">${esc(label)}</span>
      <span class="wbar__t tnum">${hhmm(s.start)}–${hhmm(s.end)}</span>
    </button>`;
}

function crewList(){
  const q = state.search.trim().toLowerCase();
  const crews = tokensOf('crew'), depts = tokensOf('dept');
  return STAFF.filter(p=>{
    if (state.deptFilter!=='all' && p.dept!==state.deptFilter) return false;
    if (crews.length && !crews.includes(p.id)) return false;
    if (depts.length && !depts.includes(p.dept)) return false;
    if (q && !p.name.toLowerCase().includes(q))
      return SHIFTS.some(s=>s.staffId===p.id && shiftVisible(s));
    return true;
  });
}

/* Full-time and freelance crew are engaged on completely different
   terms — worth a visible break between them wherever a list of people
   is long enough to benefit from one. */
function empSections(members){
  const fulltime = members.filter(p=>p.employment==='fulltime');
  const freelance = members.filter(p=>p.employment==='freelance');
  const out = [];
  if (fulltime.length) out.push({ label:'Full-time', members:fulltime });
  if (freelance.length) out.push({ label:'Freelance', members:freelance });
  return out;
}
function empSubHtml(label, rowClass){
  return `<div class="${rowClass||'row'}"><div class="empsub"><span>${label}</span></div></div>`;
}

function renderCrew(){
  const days = activeDays();
  crewGrid.style.setProperty('--days', days.length);
  const people = crewList();
  const inRange = SHIFTS.filter(s=>days.includes(s.date));

  const head = dayHead(`<span class="corner__meta">${people.length} shown</span>`, d=>{
    const all = SHIFTS.filter(s=>s.date===d);
    const f = all.filter(s=>s.staffId).length;
    return { text:`${f}/${all.length} filled`, short:f<all.length };
  });
  let html = head;

  const groups = state.deptFilter==='all'
    ? DEPARTMENTS.map(dp=>({key:dp.id,name:dp.name,members:people.filter(p=>p.dept===dp.id)})).filter(g=>g.members.length)
    : [{key:state.deptFilter,name:dept(state.deptFilter).name,members:people,flat:true}];

  for (const g of groups){
    if (!g.flat){
      const collapsed = state.collapsed.has('dept:'+g.key);
      html += `<div class="row"><button class="grouprow ${collapsed?'is-collapsed':''}" data-group="dept:${g.key}" aria-expanded="${!collapsed}">
        ${svgCaret}<span class="grouprow__name">${g.name}</span></button></div>`;
      if (collapsed) continue;
    }
    const sections = empSections(g.members);
    for (const sec of sections){
      if (sections.length>1) html += empSubHtml(sec.label);
      for (const p of sec.members) html += crewRowHtml(p, days);
    }
  }
  if (!people.length){
    html = head + emptyRow('row', svgEmptyPeople, 'Nobody matches this filter',
      'Try another department, or clear the search to bring the full crew list back.',
      `<button class="btn btn--sm" data-clearfilters>Clear filters</button>`);
  }
  crewGrid.innerHTML = html;
  const ids = new Set(people.map(p=>p.id));
  const mine = inRange.filter(s=>s.staffId && ids.has(s.staffId));
  const openHere = inRange.filter(s=>!s.staffId && role(s.roleId).dept===state.deptFilter);
  $('#crewMeta').textContent = state.deptFilter==='all'
    ? `${inRange.filter(s=>s.staffId).length} of ${inRange.length} shifts filled`
    : `${mine.length} shifts${openHere.length?` · ${openHere.length} to fill`:''}`;
}

const HOURS_CHECKS = new Set(['ot-day','ot-week','weekly','rdo','rdo-worked','rdo-clash']);
/* Days in view where this person has nothing on and nothing marked. */
function freeDays(staffId, days){
  return days.filter(d=>
    !offOn(staffId, d) && !(idx().byStaff.get(staffId) || []).some(s=>s.date===d));
}
function offBlock(o){
  return `<button class="offbar" data-off="${o.id}"
    style="left:${tlLeft(RDO_START)}%;width:${tlPos(mins(RDO_END)/60)-tlPos(mins(RDO_START)/60)}%"
    aria-label="Rostered day off — click to remove">
    <span class="offbar__l">RDO</span></button>`;
}

function crewRowHtml(p, days){
  const rowIssues = SHIFTS.filter(s=>s.staffId===p.id && days.includes(s.date))
    .flatMap(s=>shIssues(s.id))
    .filter(c=>!HOURS_CHECKS.has(c.type));
  const lvl = levelOf(rowIssues);
  const free = isFullTime(p) ? freeDays(p.id, days) : [];
  let html = `<div class="row lane"><div class="namecell" data-staffname="${p.id}" draggable="true" tabindex="0">
      <span class="namecell__body"><span class="namecell__name">${p.name}</span>
        <span class="namecell__sub">${hoursLine(p)}</span></span>
      ${free.length?`<button class="rdoAdd" data-addrdo="${p.id}"
        aria-label="Mark ${p.name}'s ${free.length} free day${free.length===1?'':'s'} this week as rostered days off"
        >+ RDO</button>`:''}
      ${lvl?`<span class="namecell__flag ${lvl==='hard'?'namecell__flag--hard':''}">${svgWarn(12)}</span>`:''}</div>`;
  for (const d of days){
    const list = SHIFTS.filter(s=>s.staffId===p.id && s.date===d && shiftVisible(s))
                       .sort((a,b)=>mins(a.start)-mins(b.start));
    const off = offOn(p.id, d);
    html += `<div class="cell ${d===state.today?'is-today':''}" data-staff="${p.id}" data-date="${d}">
      ${cellGrid()}${nowMark(d)}${off?offBlock(off):''}${list.map(shiftBlock).join('')}
      <button class="cell__add" data-newshift="${p.id}|${d}" aria-label="Add a shift for ${p.name}">${svgPlus}</button></div>`;
  }
  return html + `</div>`;
}

/* ---------- the visible hours ----------
   A fixed 04:00–02:00 window spends two thirds of every cell on hours
   nothing is booked in, which is why bars were narrow enough to truncate
   their own names. The window is fitted to what's on screen instead:
   the earliest call to the latest wrap, padded to whole hours, and never
   allowed to get so tight that a short day fills the width. */
let TL_A = 6, TL_B = 24;
function fitWindow(days){
  const set = new Set(days);
  let lo = Infinity, hi = -Infinity;
  const consider = (start, end)=>{
    const s = mins(start)/60;
    let e = mins(end)/60;
    if (e <= s) e += 24;
    lo = Math.min(lo, s); hi = Math.max(hi, e);
  };
  for (const b of BOOKINGS) if (set.has(b.date)) consider(b.start, b.end);
  for (const x of SHIFTS)  if (set.has(x.date)) consider(x.start, x.end);
  if (lo === Infinity){ TL_A = 6; TL_B = 24; return; }
  /* Whole hours, an hour of air either side, and a floor of ten hours so
     a single short booking doesn't stretch across the whole pane. */
  TL_A = Math.max(0, Math.floor(lo) - 1);
  TL_B = Math.ceil(hi) + 1;
  if (TL_B - TL_A < 10){
    const pad = (10 - (TL_B - TL_A)) / 2;
    TL_A = Math.max(0, Math.floor(TL_A - pad));
    TL_B = TL_A + 10;
  }
}
const tlPos = h => ((h-TL_A)/(TL_B-TL_A))*100;
const tlLeft = t => tlPos(mins(t)/60);
const tlWide = x => (durH(x)/(TL_B-TL_A))*100;
const hourMarks = ()=>{ const a=[]; for(let h=TL_A;h<=TL_B;h++) a.push(h); return a; };
/* Labelled marks every three hours in a fitted window — six was right
   for a 22-hour scale and far too sparse for a twelve-hour one. */
const isMajor = h => h % 3 === 0;
/* Left over from the fixed window, where it marked the working day
   against the small hours. The window is the working day now. */
const dayBand = '';
const tlHead = label=>`<div class="tl-row dayhead"><div class="corner">${label}
    <button class="dayhead__print corner__print" data-printday="${state.focusDay}"
      aria-label="Print call sheet for this day">${svgPrint(13)}</button></div><div class="tl-hours">
  ${hourMarks().map(h=>`<span class="tl-hour ${isMajor(h)?'is-major':''}" style="left:${tlPos(h)}%">${String(h%24).padStart(2,'0')}</span>`).join('')}
  ${nowFlag(state.focusDay)}</div></div>`;
const tlGrid = ()=>`<span class="tl-lane__grid">${hourMarks().map(h=>`<span class="${isMajor(h)?'is-major':''}" style="left:${tlPos(h)}%"></span>`).join('')}</span>`;

      <span class="grouprow__name">${g}</span></div></div>`;
    for (const f of items){

/* ---------- tray + chrome ---------- */
function renderTray(){
  const days = activeDays();
  const inDept = s => state.deptFilter==='all' || role(s.roleId).dept===state.deptFilter;
  const open = SHIFTS.filter(s=>!s.staffId && days.includes(s.date) && inDept(s))
                     .sort((a,b)=>a.date.localeCompare(b.date)||mins(a.start)-mins(b.start));
  const scope = state.deptFilter==='all' ? '' : ` in ${dept(state.deptFilter).name}`;
  $('#trayTitle').textContent = open.length ? `${open.length} position${open.length===1?'':'s'} to fill${scope}` : `Fully crewed${scope}`;
  $('#trayHint').textContent = open.length ? 'Drag onto a person' : 'Nothing outstanding';
  $('#trayScroll').innerHTML = open.length
    ? open.map(s=>{ const b = s.bookingId?booking(s.bookingId):null;
        return `<button class="block block--open" draggable="true" data-shift="${s.id}" style="--c:${b?b.colour:'#8A8F99'}">
          <span class="block__t tnum">${shortDay(s.date)} ${s.start}–${s.end}</span>
          <span class="block__n">${role(s.roleId).name}</span>
          <span class="block__s">${b?esc(b.name):'No booking'}</span></button>`; }).join('')
    : `<span class="tray__empty">Every position${scope} this ${state.view==='day'?'day':state.view==='month'?'month':'week'} has a name against it.</span>`;
}

function renderChrome(){
  if (state.view==='month'){
    const d = monthAnchor();
    $('#rangeLabel').innerHTML = `${MON[d.getMonth()]}<small>${d.getFullYear()}</small>`;
  } else {
    const days = weekDays();
    const a = toDate(days[0]), b = toDate(days[6]);
    $('#rangeLabel').innerHTML = state.view==='day'
      ? `${shortDay(state.focusDay)}<small>${toDate(state.focusDay).getFullYear()}</small>`
      : `${a.getDate()} ${a.getMonth()===b.getMonth()?'':MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}<small>${a.getFullYear()}</small>`;
  }
}

function renderRoster(){
  rebuildChecks();
  if (state.view==='day'){ renderFacilitiesDay(); renderCrewDay(); }
  else { renderFacilities(); renderCrew(); }
  renderTray();
  renderChrome();
  if (state.sel) renderInspector();
}

function render(){
  if (state.page==='shows') renderShowsPage();
  else renderRoster();
}

function setPage(page){
  state.page = page;
  $('#app').classList.toggle('is-shows-page', page==='shows');
  $('#navRoster').setAttribute('aria-pressed', page==='roster');
  $('#navShows').setAttribute('aria-pressed', page==='shows');
  if (page==='shows' && state.sel) closeInspector();
  render();
}

function select(kind, id, draft){
  state.sel = { kind, id, draft };
  $('#inspBackdrop').classList.add('is-open');
  render();
}
function closeInspector(){
  state.sel = null;
  $('#inspBackdrop').classList.remove('is-open');
  render();
}
function conflictHtml(list, emptyText){
  if (!list.length) return `<div class="empty-note">${emptyText}</div>`;
  return list.map(c=>`<div class="conflict ${c.level==='hard'?'conflict--hard':''}">${svgWarn(13)}
    <div><div class="conflict__t">${c.title}</div><div class="conflict__d">${c.detail}</div></div></div>`).join('');
}
function renderInspector(){
  const sel = state.sel; if (!sel) return;
  if (sel.kind==='booking' && !booking(sel.id)) return closeInspector();
  if (sel.kind==='shift' && !byId(SHIFTS,sel.id)) return closeInspector();
  ({ booking:inspBooking, shift:inspShift, 'new-booking':inspNewBooking, 'new-shift':inspNewShift })[sel.kind]();
}

/* ============================================================
   9. SHOWS PAGE — the show library, and the editor that owns a
   show's standing definition. Opening a show loads what it looks
   like right now; edits are held as a draft until you save. Saving
   asks which bookings on the roster should follow the change, so a
   time, facility or crew change can be pushed across the season in
   one action instead of booking by booking.
   ============================================================ */
function renderShowsPage(){
  if (state.showSel) renderShowEditor();
  else renderShowsList();
}

/* The next day this show would have run, so flipping a weekly show to a
   one-off lands on a date that already makes sense for it. */
function nextMatchingDay(sh){
  if (!sh.days || !sh.days.length) return state.today;
  for (let i=0, d=state.today; i<14; i++, d=addDays(d,1))
    if (sh.days.includes(toDate(d).getDay())) return d;
  return state.today;
}

function cloneShow(sh){
  return { ...sh, facilityIds:[...sh.facilityIds], days:[...sh.days],
    positions: sh.positions.map(p=>({...p})), rundown: sh.rundown.map(r=>({...r})),
    tx: (sh.tx||[]).map(t=>({...t})) };
}
const sameList = (a,b)=> a.length===b.length && a.every((x,i)=>x===b[i]);

function openShow(id){
  const sh = byId(SHOWS, id); if (!sh) return;
  state.showSel = id;
  state.showDraft = cloneShow(sh);
  render();
}
function newShowDraft(){
  state.showSel = 'new';
  state.showDraft = {
    name:'', colour: PALETTE[SHOWS.length % PALETTE.length], notes:'',
    facilityIds:[], positions:[], days:[1,2,3,4,5],
    start:'09:00', end:'17:00',
    oneOff:false, oneOffDate:'',
    project:'', jobDetails:'', tx:[],
    seasonStart:SEASON.start, seasonEnd:SEASON.end, rundown:[]
  };
  render();
}
function closeShowEditor(){
  state.showSel = null;
  state.showDraft = null;
  render();
}

/* ---------- what changed, and what it will touch ---------- */
const showBookings = showId => BOOKINGS.filter(b=>b.showId===showId);
function scopedBookings(showId, scope){
  if (scope==='none') return [];
  const all = showBookings(showId);
  return scope==='all' ? all : all.filter(b=>b.date>=state.today);
}
const facsLabel = ids => ids.length ? ids.map(f=>facility(f).short).join(', ') : 'none';
const whoLabel  = id  => id ? person(id).name : 'Open';
const offLabel  = p   => `call ${p.call}m before, wrap ${p.wrap}m after`;

/* A plain-language list of the differences between the saved show and
   the draft. It drives both the summary in the save bar and what the
   apply step is allowed to touch. */
function showDiff(saved, draft){
  const out = [];
  const add = (key,label)=> out.push({ key, label });
  if (saved.name!==draft.name)         add('name',`Name — ${saved.name || 'untitled'} to ${draft.name || 'untitled'}`);
  if (saved.colour!==draft.colour)     add('colour','Colour');
  if (saved.start!==draft.start)       add('start',`Start — ${saved.start} to ${draft.start}`);
  if (saved.end!==draft.end)           add('end',`End — ${saved.end} to ${draft.end}`);
  if (!saved.oneOff !== !draft.oneOff)
    add('repeat', draft.oneOff ? 'Now a one-off' : 'Now a repeating show');
  if (draft.oneOff && saved.oneOffDate!==draft.oneOffDate)
    add('date',`Date — ${saved.oneOffDate ? shortDay(saved.oneOffDate) : 'unset'} to ${draft.oneOffDate ? shortDay(draft.oneOffDate) : 'unset'}`);
  if (!draft.oneOff && !sameList(saved.days, draft.days))
    add('days',`Days — ${daysSummary(saved.days)} to ${daysSummary(draft.days)}`);
  if (!sameList(saved.facilityIds, draft.facilityIds))
    add('facilities',`Facilities — ${facsLabel(saved.facilityIds)} to ${facsLabel(draft.facilityIds)}`);
  if (saved.notes!==draft.notes)       add('notes','Notes');
  if (!draft.oneOff && (saved.seasonStart!==draft.seasonStart || saved.seasonEnd!==draft.seasonEnd))
    add('season',`Season — ${draft.seasonStart} to ${draft.seasonEnd}`);
  if (JSON.stringify(saved.rundown)!==JSON.stringify(draft.rundown)) add('rundown','Rundown');
  if ((saved.project||'')!==(draft.project||'')) add('project',`Project — ${draft.project||'cleared'}`);
  if ((saved.jobDetails||'')!==(draft.jobDetails||'')) add('job',`Job details — ${draft.jobDetails||'cleared'}`);
  if (JSON.stringify(saved.tx||[])!==JSON.stringify(draft.tx||[])) add('tx','TX and record times');

  const was = new Map(saved.positions.map(p=>[p.pid,p]));
  const now = new Map(draft.positions.map(p=>[p.pid,p]));
  draft.positions.forEach(p=>{
    if (!was.has(p.pid)) add('pos+',`Added ${role(p.roleId).name} — ${whoLabel(p.staffId)}`);
  });
  saved.positions.forEach(p=>{
    if (!now.has(p.pid)) add('pos-',`Removed ${role(p.roleId).name} — ${whoLabel(p.staffId)}`);
  });
  draft.positions.forEach(p=>{
    const q = was.get(p.pid); if (!q) return;
    if (q.roleId!==p.roleId)   add('pos',`${role(q.roleId).name} is now ${role(p.roleId).name}`);
    if (q.staffId!==p.staffId) add('pos',`${role(p.roleId).name} — ${whoLabel(q.staffId)} to ${whoLabel(p.staffId)}`);
    if (q.call!==p.call || q.wrap!==p.wrap) add('pos',`${role(p.roleId).name} ${offLabel(p)}`);
  });
  return out;
}

/* Pushes a saved edit down onto the bookings in scope. A booking that
   has been customised away from the template keeps its own value —
   only the ones still matching the old show follow the change. Any
   shift whose hours move drops back to draft, so it has to be
   published again before the crew sees it. */
function applyShowToBookings(saved, next, targets){
  const dStart = mins(next.start) - mins(saved.start);
  const dEnd   = mins(next.end)   - mins(saved.end);
  const was = new Map(saved.positions.map(p=>[p.pid,p]));
  const now = new Map(next.positions.map(p=>[p.pid,p]));
  const rep = { bookings:0, moved:0, added:0, removed:0, kept:0, reassigned:0 };

  targets.forEach(b=>{
    let touched = false;
    if (next.name!==saved.name && b.name===saved.name)       { b.name = next.name; touched = true; }
    if (next.colour!==saved.colour && b.colour===saved.colour){ b.colour = next.colour; touched = true; }
    if (next.notes!==saved.notes && b.notes===saved.notes)   { b.notes = next.notes; touched = true; }
    if ((next.project||'')!==(saved.project||'') && (b.project||'')===(saved.project||'')){
      b.project = next.project; touched = true; }
    if ((next.jobDetails||'')!==(saved.jobDetails||'') && (b.jobDetails||'')===(saved.jobDetails||'')){
      b.jobDetails = next.jobDetails; touched = true; }
    if (JSON.stringify(next.tx||[])!==JSON.stringify(saved.tx||[])
        && JSON.stringify(b.tx||[])===JSON.stringify(saved.tx||[])){
      b.tx = (next.tx||[]).map(t=>({...t})); touched = true; }
    if (!sameList(next.facilityIds, saved.facilityIds) && sameList(b.facilityIds, saved.facilityIds)){
      b.facilityIds = [...next.facilityIds]; touched = true;
    }
    if (next.oneOff && next.oneOffDate && b.date===saved.oneOffDate && b.date!==next.oneOffDate){
      b.date = next.oneOffDate;
      SHIFTS.filter(x=>x.bookingId===b.id).forEach(x=>{ x.date = next.oneOffDate; x.status = 'draft'; });
      touched = true;
    }
    if (dStart){ b.start = b.start===saved.start ? next.start : addMins(b.start, dStart); touched = true; }
    if (dEnd)  { b.end   = b.end===saved.end     ? next.end   : addMins(b.end, dEnd);     touched = true; }

    const mine = SHIFTS.filter(s=>s.bookingId===b.id);
    const drop = new Set();
    mine.forEach(s=>{
      const a = s.posId ? was.get(s.posId) : null;
      const z = s.posId ? now.get(s.posId) : null;

      if (a && !z){                                  /* seat taken off the template */
        if (!s.staffId){ drop.add(s.id); rep.removed++; touched = true; return; }
        s.posId = null; rep.kept++;                  /* someone is on it — keep them, but */
      }                                              /* the hours still follow the booking */
      if (!a || !z){                                 /* added by hand — follows the clock only */
        if (dStart || dEnd){
          s.start = addMins(s.start, dStart); s.end = addMins(s.end, dEnd);
          if (s.status==='published') s.status = 'draft';
          rep.moved++; touched = true;
        }
        return;
      }
      if (z.roleId!==a.roleId) s.roleId = z.roleId;
      if (z.staffId!==a.staffId && s.staffId===a.staffId){
        s.staffId = z.staffId; s.status = 'draft'; rep.reassigned++; touched = true;
      }
      const aStart = posStart(saved,a), aEnd = posEnd(saved,a);
      const zStart = posStart(next,z),  zEnd = posEnd(next,z);
      if (s.start===aStart && s.end===aEnd){
        if (s.start!==zStart || s.end!==zEnd){
          s.start = zStart; s.end = zEnd;
          if (s.status==='published') s.status = 'draft';
          rep.moved++; touched = true;
        }
      } else if (dStart || dEnd){
        s.start = addMins(s.start, dStart); s.end = addMins(s.end, dEnd);
        if (s.status==='published') s.status = 'draft';
        rep.moved++; touched = true;
      }
    });
    if (drop.size) SHIFTS = SHIFTS.filter(s=>!drop.has(s.id));

    next.positions.forEach(p=>{
      if (was.has(p.pid)) return;
      if (SHIFTS.some(s=>s.bookingId===b.id && s.posId===p.pid)) return;
      SHIFTS.push({ id:newShId(), bookingId:b.id, showId:next.id, posId:p.pid,
        staffId:p.staffId, roleId:p.roleId, date:b.date,
        start:posStart(next,p), end:posEnd(next,p), status:'draft', note:'' });
      rep.added++; touched = true;
    });

    if (touched) rep.bookings++;
  });
  return rep;
}

      <div class="showCard__name">${esc(sh.name)}</div>
      <div class="showCard__row">${svgClock}${sh.oneOff ? `One-off${sh.oneOffDate?` · ${shortDay(sh.oneOffDate)}`:''}` : daysSummary(sh.days)} · ${sh.start}–${sh.end}</div>
      <div class="showCard__row">${svgFac}${sh.facilityIds.length ? sh.facilityIds.map(f=>facility(f).short).join(', ') : 'No facility set'}</div>
      <div class="showCard__row">${svgPeople}${sh.positions.length} position${sh.positions.length===1?'':'s'}${open?` · ${open} booked out`:''} · ${sh.rundown.length} segment${sh.rundown.length===1?'':'s'}</div>
      <div class="showCard__foot">${sh.oneOff

function airingRowHtml(b){

}

function renderShowEditor(){

  const scrollEl = $('#showsScroll');

  const changes = isNew ? [] : showDiff(saved, sh);

  const allBk = isNew ? [] : showBookings(saved.id);
  const upcoming = allBk.filter(b=>b.date>=state.today).sort((a,b)=>a.date.localeCompare(b.date));

  scrollEl.innerHTML = `

      <div class="showEditor__head">
        <div class="showEditor__name">

          <div class="showEditor__sub">
            <span class="pill ${dirty?'pill--dirty':''}">${isNew?'Not created yet':dirty?`${changes.length} unsaved change${changes.length===1?'':'s'}`:'Saved'}</span>
            ${isNew?'':`<span class="showEditor__meta">${allBk.length} booking${allBk.length===1?'':'s'} on the roster · ${upcoming.length} upcoming</span>`}
          </div>
        </div>
        <div class="showEditor__actions">
          ${isNew
            ? `<button class="btn btn--primary" id="shCreate">Create show</button><button class="btn" id="shCancel">Cancel</button>`

        </div>
      </div>

      <div class="showEditor__grid">
        <div>
          <div class="sechead"><h3>Colour</h3></div>
          <div class="swatches">${PALETTE.map(c=>`<button class="swatch ${c===sh.colour?'is-selected':''}" data-swatch="${c}" style="background:${c}" aria-label="Use this colour"></button>`).join('')}</div>

          <div class="sechead"><h3>Schedule</h3></div>
          <div class="field"><div class="field__label">Repeats</div>
            <div class="segmented segmented--wide" role="group" aria-label="How often this show runs">
              <button data-repeat="weekly" aria-pressed="${!sh.oneOff}">Weekly</button>

          <div class="field__2">
            <div class="field"><div class="field__label">Starts</div><input class="tf" inputmode="numeric" maxlength="5" placeholder="00:00" type="text" id="shStart" value="${sh.start}"></div>
            <div class="field"><div class="field__label">Ends</div><input class="tf" inputmode="numeric" maxlength="5" placeholder="00:00" type="text" id="shEnd" value="${sh.end}"></div>
          </div>
          ${sh.oneOff ? '' : `<div class="field__2">
            <div class="field"><div class="field__label">Season from</div><input type="date" id="shSeasonStart" value="${sh.seasonStart}"></div>
            <div class="field"><div class="field__label">Season to</div><input type="date" id="shSeasonEnd" value="${sh.seasonEnd}"></div>
          </div>`}

          <div class="sechead"><h3>Facilities</h3></div>
          <div class="field">${facilityChecklist(sh.facilityIds, 'shfac', new Set())}</div>

          <div class="sechead"><h3>Work order</h3></div>
          <div class="field"><div class="field__label">Project</div>
            <input type="text" id="shProject" value="${esc(sh.project||'')}" placeholder="Rugby League / NRL 360 / NR3260920/"></div>
          <div class="field"><div class="field__label">Job details</div>
            <input type="text" id="shJob" value="${esc(sh.jobDetails||'')}" placeholder="Live 1830"></div>
          <div class="field"><div class="field__label">TX and record times</div>
            ${(sh.tx||[]).map((t,i)=>`<div class="txRow" data-txrow="${i}">
              <select class="select" data-tx="kind">
                ${['Live TX','Record','Rehearsal'].map(k=>`<option ${k===t.kind?'selected':''}>${k}</option>`).join('')}
              </select>
              <input class="tf" inputmode="numeric" maxlength="5" placeholder="00:00" type="text" data-tx="from" value="${t.from}">
              <input class="tf" inputmode="numeric" maxlength="5" placeholder="00:00" type="text" data-tx="to" value="${t.to}">
              <input type="text" data-tx="resource" value="${esc(t.resource||'')}" placeholder="Channel">
              <button class="posRow__x" data-txdel="${i}" aria-label="Remove">${svgX()}</button>
            </div>`).join('') || `<div class="empty-note">No TX or record time set.</div>`}
            <button class="btn btn--sm" id="shAddTx" style="margin-top:8px">${svgPlus} Add time</button>
          </div>

          <div class="sechead"><h3>Notes</h3></div>
          <div class="field"><textarea id="shNotes" placeholder="Anything that applies every time this show airs. This is what shows on the hover card.">${esc(sh.notes)}</textarea></div>

          ${isNew ? '' : `
          <div class="sechead"><h3>On the roster</h3><span>${upcoming.length} upcoming</span></div>
          <div>${upcoming.slice(0,6).map(airingRowHtml).join('') ||
            `<div class="empty-note">Nothing upcoming — generate bookings below.</div>`}</div>`}
        </div>

        <div>
          <div class="sechead"><h3>Standard crew</h3><span>${sh.positions.length} position${sh.positions.length===1?'':'s'}</span></div>
          <div class="posHead"><span>Position</span><span>Regular</span><span>Call / wrap</span><span></span></div>
          <div>${posRows}</div>
          <div class="field__2" style="margin-top:10px">
            <div class="field"><div class="field__label">Add position</div>
              <select class="select" id="shAddRole">${ROLES.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select></div>
            <div class="field" style="display:flex;align-items:flex-end">
              <button class="btn btn--sm" id="shAddPos" style="width:100%;justify-content:center">${svgPlus} Add to crew</button></div>
          </div>

          <div class="sechead"><h3>Rundown</h3><span>${sh.rundown.length} segments</span></div>
          <div>${rundownRows}</div>
          <button class="btn btn--sm" id="shAddSeg" style="margin-top:8px">${svgPlus} Add segment</button>

          ${isNew
            ? `<div class="empty-note" style="margin-top:8px">Create the show, then put it on the roster.</div>`
            : sh.oneOff
            ? `<div class="sechead"><h3>Put it on the roster</h3></div>
               <button class="btn btn--primary btn--sm" id="genBookings">Add the booking</button>
               <div class="empty-note" style="margin-top:8px">Adds the single booking on ${sh.oneOffDate ? shortDay(sh.oneOffDate) : 'the date above'}, crewed from the standard crew. Does nothing if it's already there.</div>`
            : `<div class="sechead"><h3>Generate bookings</h3></div>
               <div class="field__2">
                 <div class="field"><div class="field__label">From</div><input type="date" id="genFrom" value="${state.today>sh.seasonStart?state.today:sh.seasonStart}"></div>
                 <div class="field"><div class="field__label">To</div><input type="date" id="genTo" value="${sh.seasonEnd}"></div>
               </div>
               <button class="btn btn--primary btn--sm" id="genBookings">Generate bookings</button>
               <div class="empty-note" style="margin-top:8px">Adds one booking per matching day, crewed from the standard crew above. Days that already have one are skipped.</div>`}
        </div>
      </div>

      ${dirty ? `
      <div class="saveBar">
        <div class="saveBar__l">
          <div class="saveBar__t">${changes.length} unsaved change${changes.length===1?'':'s'}</div>
          <div class="chgList">${changes.slice(0,6).map(c=>`<span class="chg">${esc(c.label)}</span>`).join('')}${changes.length>6?`<span class="chg">+${changes.length-6} more</span>`:''}</div>
        </div>
        <div class="saveBar__r">
          <label class="saveBar__scope">Apply to
            <select class="select" id="shScope">
              <option value="future" ${scope==='future'?'selected':''}>Upcoming bookings (${upcoming.length})</option>
              <option value="all" ${scope==='all'?'selected':''}>Every booking (${allBk.length})</option>
              <option value="none" ${scope==='none'?'selected':''}>Show only — leave bookings</option>
            </select>
          </label>
          <button class="btn" id="shDiscard">Discard</button>
          <button class="btn btn--primary" id="shSave">Save${scopeCount?` and update ${scopeCount}`:''}</button>
        </div>
      </div>` : ''}
    </div>`;

  scrollEl.scrollTop = savedScroll;

  const patch = (p)=>{ Object.assign(state.showDraft, p); renderShowEditor(); };

  $('#backToShows').onclick = ()=>{
    if (dirty){ toast('Save or discard your changes first.'); return; }
    closeShowEditor();
  };
  $('#shName').onchange   = e=> patch({ name:e.target.value });
  bindTimeField($('#shStart'), v=> patch({ start:v }));
  bindTimeField($('#shEnd'),   v=> patch({ end:v }));
  $('#shNotes').onchange  = e=> patch({ notes:e.target.value });
  $('#shProject').onchange = e=> patch({ project:e.target.value });
  $('#shJob').onchange     = e=> patch({ jobDetails:e.target.value });
  $$('[data-tx]').forEach(el=>{
    const write = val =>{
      const i = Number(el.closest('[data-txrow]').dataset.txrow);
      const tx = (sh.tx||[]).map(x=>({...x}));
      tx[i][el.dataset.tx] = val;
      patch({ tx });
    };
    if (el.classList.contains('tf')) bindTimeField(el, write);
    else el.onchange = ()=> write(el.value);
  });
  $$('[data-txdel]').forEach(el=> el.onclick = ()=>{
    const tx = (sh.tx||[]).slice(); tx.splice(Number(el.dataset.txdel),1);
    patch({ tx });
  });
  $('#shAddTx').onclick = ()=> patch({ tx:[...(sh.tx||[]),
    { kind:'Live TX', from:sh.start, to:sh.end, resource:'' }] });
  if (!sh.oneOff){
    $('#shSeasonStart').onchange = e=> patch({ seasonStart:e.target.value });
    $('#shSeasonEnd').onchange   = e=> patch({ seasonEnd:e.target.value });
  }

  $$('[data-swatch]').forEach(el=> el.onclick = ()=> patch({ colour: el.dataset.swatch }));
  $$('[data-repeat]').forEach(el=> el.onclick = ()=>{
    const once = el.dataset.repeat==='once';
    /* Switching to a one-off defaults the date to the show's next
       matching day, so the field is rarely empty when it appears. */
    patch({ oneOff:once, oneOffDate: once ? (sh.oneOffDate || nextMatchingDay(sh)) : sh.oneOffDate });
  });
  if (sh.oneOff) $('#shOneDate').onchange = e=> patch({ oneOffDate:e.target.value });
  $$('[data-day]').forEach(el=> el.onclick = ()=>{
    const d = Number(el.dataset.day);
    const days = sh.days.includes(d) ? sh.days.filter(x=>x!==d) : [...sh.days, d];
    patch({ days: days.sort((a,b)=>a-b) });
  });
  $$('[data-shfac]').forEach(el=> el.onchange = ()=>
    patch({ facilityIds: $$('[data-shfac]').filter(x=>x.checked).map(x=>x.dataset.shfac) }));

  const patchPos = (pid, p)=> patch({ positions: sh.positions.map(x=> x.pid===pid ? {...x, ...p} : x) });
  $$('[data-posstaff]').forEach(el=> el.onchange = ()=> patchPos(el.dataset.posstaff, { staffId: el.value || null }));
  $$('[data-poscall]').forEach(el=> el.onchange = ()=> patchPos(el.dataset.poscall, { call: Math.max(0, Number(el.value)||0) }));
  $$('[data-poswrap]').forEach(el=> el.onchange = ()=> patchPos(el.dataset.poswrap, { wrap: Math.max(0, Number(el.value)||0) }));
  $$('[data-rmpos]').forEach(el=> el.onclick = ()=>
    patch({ positions: sh.positions.filter(x=>x.pid!==el.dataset.rmpos) }));
  $('#shAddPos').onclick = ()=> patch({ positions:[...sh.positions, P($('#shAddRole').value, null)] });

  $$('[data-airing]').forEach(el=> el.onclick = ()=>{
    if (dirty){ toast('Save or discard your changes first.'); return; }
    openBookingFromShow(el.dataset.airing);
  });

  $$('[data-rd]').forEach(el=> el.onchange = ()=>{
    const i = Number(el.closest('[data-rdrow]').dataset.rdrow);
    const rundown = sh.rundown.map(x=>({...x}));
    rundown[i][el.dataset.rd] = el.value;
    patch({ rundown });
  });
  $$('[data-rddel]').forEach(el=> el.onclick = ()=>{
    const rundown = sh.rundown.slice(); rundown.splice(Number(el.dataset.rddel),1);
    patch({ rundown });
  });
  $$('[data-rdup]').forEach(el=> el.onclick = ()=>{
    const i = Number(el.dataset.rdup); if (i<1) return;
    const rundown = sh.rundown.slice(); [rundown[i-1],rundown[i]]=[rundown[i],rundown[i-1]];
    patch({ rundown });
  });
  $$('[data-rddown]').forEach(el=> el.onclick = ()=>{
    const i = Number(el.dataset.rddown); if (i>=sh.rundown.length-1) return;
    const rundown = sh.rundown.slice(); [rundown[i],rundown[i+1]]=[rundown[i+1],rundown[i]];
    patch({ rundown });
  });
  $('#shAddSeg').onclick = ()=>{
    const last = sh.rundown[sh.rundown.length-1];
    patch({ rundown:[...sh.rundown, { time:last?last.time:sh.start, title:'', duration:'' }] });
  };

  if (isNew){
    $('#shCreate').onclick = ()=> Api.createShow(state.showDraft);
    $('#shCancel').onclick = closeShowEditor;
  } else {
    $('#shDelete').onclick = ()=> Api.deleteShow(saved.id);
    $('#shDuplicate').onclick = ()=>{
      if (dirty){ toast('Save or discard your changes first.'); return; }
      Api.duplicateShow(saved.id);
    };
    $('#genBookings').onclick = ()=>{
      if (dirty){ toast('Save your changes before generating.'); return; }
      if (saved.oneOff) Api.generateBookings(saved.id, saved.oneOffDate, saved.oneOffDate);
      else Api.generateBookings(saved.id, $('#genFrom').value, $('#genTo').value);
    };
    if (dirty){
      $('#shScope').onchange = e=>{ state.showScope = e.target.value; renderShowEditor(); };
      $('#shDiscard').onclick = ()=>{ state.showDraft = cloneShow(saved); renderShowEditor(); };
      $('#shSave').onclick = ()=> Api.saveShow(saved.id, state.showDraft, state.showScope || 'future');
    }
  }
}

/* Jump from a show straight to that airing on the roster. */
function openBookingFromShow(id){
  const b = booking(id); if (!b) return;
  state.showSel = null; state.showDraft = null;
  state.weekStart = mondayOf(b.date);
  state.focusDay = b.date;
  setPage('roster');
  select('booking', id);
}

/* ============================================================
   10. CREW MODAL — the staff directory: contact details, positions
   and what each pays, employment type, and rostered hours.
   ============================================================ */
function openCrewModal(){
  state.crewOpen = true;
  state.crewSel = null;
  state.crewDraft = null;
  $('#crewBackdrop').classList.add('is-open');
  renderCrewModal();
}
function closeCrewModal(){
  state.crewOpen = false;
  state.crewSel = null;
  state.crewDraft = null;
  $('#crewBackdrop').classList.remove('is-open');
  render();
}
function openCrewMember(id){
  state.crewSel = id;
  state.crewDraft = null;
  renderCrewModal();
}
function newStaffDraft(){
  state.crewSel = 'new';
  state.crewDraft = {
    name:'', dept:'cam', contract:38, employment:'fulltime',
    email:'', phone:'', positions:[]
  };
  renderCrewModal();
}
function closeCrewDetail(){
  state.crewSel = null;
  state.crewDraft = null;
  renderCrewModal();
}
function renderCrewModal(){
  if (!state.crewOpen) return;
  $('#crewModalMeta').textContent = `${STAFF.length} people`;
  if (state.crewSel) renderCrewDetail();
  else renderCrewList();
}

function crewStats(){
  const overCount = STAFF.filter(p=>weekHours(p.id,state.weekStart) > p.contract).length;

  const fulltime = STAFF.filter(p=>p.employment==='fulltime').length;
  const totalWeekHrs = STAFF.reduce((t,p)=>t+weekHours(p.id,state.weekStart),0);
  return { overCount, fulltime, freelance:STAFF.length-fulltime, totalWeekHrs };
}
function crewListFiltered(){
  const q = state.crewSearch.trim().toLowerCase();
  return STAFF.filter(p=>{
    if (state.crewDeptFilter!=='all' && p.dept!==state.crewDeptFilter) return false;
    if (state.crewEmpFilter!=='all' && p.employment!==state.crewEmpFilter) return false;
    if (state.crewRoleFilter!=='all' && !p.positions.some(x=>x.roleId===state.crewRoleFilter)) return false;
    if (state.crewOverOnly && weekHours(p.id, state.weekStart) <= p.contract) return false;
    return !q || p.name.toLowerCase().includes(q);
  });
}

/* The toolbar and sidebar are only built once per open — filtering
   just refreshes the row list, so the search box never loses focus
   mid-keystroke. */
function renderCrewList(){
  const stats = crewStats();
  $('#crewModalBody').innerHTML = `
    <div class="crewToolbar">
      <label class="search"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6.2" cy="6.2" r="4.2" stroke="currentColor" stroke-width="1.4"/><path d="m9.4 9.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="crewSearchInput" type="search" placeholder="Find crew" value="${esc(state.crewSearch)}" aria-label="Find crew"></label>
      <select class="select" id="crewDeptSelect"><option value="all">All departments</option>${DEPARTMENTS.map(d=>`<option value="${d.id}" ${d.id===state.crewDeptFilter?'selected':''}>${d.name}</option>`).join('')}</select>
      <select class="select" id="crewRoleSelect"><option value="all">All positions</option>${ROLES.map(r=>`<option value="${r.id}" ${r.id===state.crewRoleFilter?'selected':''}>${r.name}</option>`).join('')}</select>
      <select class="select" id="crewEmpSelect">
        <option value="all" ${state.crewEmpFilter==='all'?'selected':''}>All employment types</option>
        <option value="fulltime" ${state.crewEmpFilter==='fulltime'?'selected':''}>Full-time</option>
        <option value="freelance" ${state.crewEmpFilter==='freelance'?'selected':''}>Freelance</option>
      </select>
      <label class="chk"><input type="checkbox" id="crewOverChk" ${state.crewOverOnly?'checked':''}> Over hours only</label>
      <span class="crewToolbar__right"><button class="btn btn--primary btn--sm" id="newCrewBtn">${svgPlus} Add crew member</button></span>
    </div>

    <div class="statStrip">
      <div class="statCard"><div class="statCard__n">${STAFF.length}</div><div class="statCard__l">Crew total</div></div>
      <div class="statCard"><div class="statCard__n">${stats.fulltime}</div><div class="statCard__l">Full-time</div></div>
      <div class="statCard"><div class="statCard__n">${stats.freelance}</div><div class="statCard__l">Freelance</div></div>
      <div class="statCard"><div class="statCard__n">${Math.round(stats.totalWeekHrs)}h</div><div class="statCard__l">Rostered this week</div></div>
      <button class="statCard statCard--btn" id="crewOverStat" aria-pressed="${state.crewOverOnly}"><div class="statCard__n ${stats.overCount?'is-warn':''}">${stats.overCount}</div><div class="statCard__l">Over contracted hours</div></button>
    </div>

    <div class="crewLayout">
      <div class="crewList">
        <div class="crewHead"><span>Name</span><span>Dept</span><span>Positions</span><span>Type</span><span>Hours</span><span></span></div>
        <div id="crewRows"></div>
      </div>
    </div>`;

  $('#newCrewBtn').onclick = newStaffDraft;
  $('#crewSearchInput').oninput = e=>{ state.crewSearch = e.target.value; renderCrewRows(); };
  $('#crewDeptSelect').onchange = e=>{ state.crewDeptFilter = e.target.value; renderCrewRows(); };
  $('#crewRoleSelect').onchange = e=>{ state.crewRoleFilter = e.target.value; renderCrewRows(); };
  $('#crewEmpSelect').onchange = e=>{ state.crewEmpFilter = e.target.value; renderCrewRows(); };
  $('#crewOverChk').onchange = e=>{ state.crewOverOnly = e.target.checked; renderCrewList(); };
  $('#crewOverStat').onclick = ()=>{ state.crewOverOnly = !state.crewOverOnly; renderCrewList(); };
  renderCrewRows();
}

function renderCrewRows(){
  const list = crewListFiltered();
  $('#crewRows').innerHTML = list.length ? list.map(p=>{
    const w = weekShape(p.id, state.weekStart);
    const m = monthShape(p.id, state.weekStart);
    const ytd = otSeason(p.id);
    const flagged = w.band==='over' || m.band==='over' || w.rdoOwed;
    return `<button class="crewRow" data-crew="${p.id}">
      <span class="crewRow__name"><span class="namecell__name">${esc(p.name)}</span></span>
      <span class="crewRow__dept">${dept(p.dept).name}</span>
      <span class="crewRow__roles">${p.positions.length ? p.positions.map(x=>`<span class="roleTag">${role(x.roleId).name}</span>`).join('') : '<span class="empty-note">No positions</span>'}</span>
      <span class="empTag ${p.employment==='fulltime'?'empTag--fulltime':'empTag--freelance'}">${p.employment==='fulltime'?'Full-time':'Freelance'}</span>
      <span class="crewRow__hrs">
        <span class="band-${w.band}">${fmtH(w.hours)} / ${w.full?OT.weekStd:p.contract}h</span><br>
        <span class="crewRow__ot">${w.rdoOwed?`<span class="rdoflag">RDO ${w.rdoOwed}</span> `:''}${
          ytd.hours ? `${fmtH(ytd.hours)} OT season` : `${Math.round(m.hours)}h in 30 days`}</span></span>
      <span>${flagged ? svgWarn(13) : ''}</span>
    </button>`;
  }).join('') : `<div class="empty-note" style="padding:18px">No one matches these filters.</div>`;
  $$('[data-crew]').forEach(el=> el.onclick = ()=> openCrewMember(el.dataset.crew));
}

/* The hours picture for one person: the week and the month against
   their marks, what the season owes them in overtime and days off, and
   the specific days that ran long — which is what anyone querying an
   overtime claim actually asks to see. */
function hoursPanelHtml(p){
  const w = weekShape(p.id, state.weekStart);
  const m = monthShape(p.id, state.weekStart);
  const ytd = otSeason(p.id);
  const long = otDays(p.id, state.weekStart, addDays(state.weekStart, 6));

  if (!isFullTime(p)){
    return `<div class="sechead"><h3>Hours</h3><span>${shortDay(state.weekStart)} to ${shortDay(addDays(state.weekStart,6))}</span></div>
      <div class="figures">
        <div class="figure"><b>${fmtH(w.hours)}</b><span>rostered this week</span><em>booked at ${p.contract}h</em></div>
        <div class="figure"><b>${fmtH(m.hours)}</b><span>rostered in 30 days</span><em>rolling</em></div>
        <div class="figure"><b>${w.worked}</b><span>days worked</span><em>this week</em></div>
      </div>
      <div class="exportNote">Engaged per shift, so the standard week, overtime bands and
        rostered days off don't apply.</div>`;
  }

  const weekOT = long.reduce((t,x)=>t+x.over, 0);
  const weekWorked = long.reduce((t,x)=>t+x.worked, 0);
  const span = `${shortDay(state.weekStart)} to ${shortDay(addDays(state.weekStart,6))}`;

  /* Week first, then the season, so the figure that matches the table
     underneath sits next to it rather than being read against a season
     total that never will. */
  return `<div class="sechead"><h3>Hours and overtime</h3><span>${span}</span></div>
    <div class="figures">
      <div class="figure band-${w.band}"><b>${fmtH(w.hours)}</b>
        <span>rostered this week</span><em>of ${OT.weekStd}h — ${BAND_WORD[w.band]}</em></div>
      <div class="figure ${weekOT?'band-over':''}"><b>${fmtH(weekOT)}</b>
        <span>overtime this week</span><em>${(()=>{
          if (!long.length) return 'none this week';
          const rdoDays = long.filter(x=>x.kind==='rdo').length;
          const plain = long.length - rdoDays;
          const bits = [];
          if (plain) bits.push(`${plain} day${plain===1?'':'s'} past ${OT.dayStd}h`);
          if (rdoDays) bits.push(`${rdoDays} day${rdoDays===1?'':'s'} off worked`);
          return bits.join(' · ');
        })()}</em></div>
      <div class="figure ${w.rdoOwed?'band-over':''}"><b>${w.rdoOwed || w.daysOff}</b>
        <span>${w.rdoOwed?`day${w.rdoOwed===1?'':'s'} off owed`:`day${w.daysOff===1?'':'s'} off taken`}</span>
        <em>${w.worked} day${w.worked===1?'':'s'} worked — ${OT.rdoPerWeek} off a week</em></div>
      <div class="figure band-${m.band}"><b>${fmtH(m.hours)}</b>
        <span>rostered in 30 days</span><em>of ${OT.monthStd}h — ${BAND_WORD[m.band]}</em></div>
      <div class="figure ${ytd.hours?'band-over':''}"><b>${fmtH(ytd.hours)}</b>
        <span>overtime this season</span>
        <em>${shortDay(SEASON.start)} to ${shortDay(ytd.to)} — ${ytd.days} day${ytd.days===1?'':'s'}</em></div>
    </div>

    <div class="sechead"><h3>Overtime by day</h3><span>${span}</span></div>
    ${long.length ? `<table class="otTable">
      <thead><tr><th>Day</th><th class="n">Worked</th><th class="n">Overtime</th><th>Why</th><th>On</th></tr></thead>
      <tbody>${long.map(x=>{
        const on = (idx().byStaff.get(p.id) || []).filter(sx=>sx.date===x.date);
        const names = [...new Set(on.map(sx=>sx.bookingId ? booking(sx.bookingId).name : role(sx.roleId).name))];
        return `<tr><td>${shortDay(x.date)}${x.kind==='rdo'?` <span class="rdoflag">RDO</span>`:''}</td>
          <td class="n">${fmtH(x.worked)}</td>
          <td class="n band-over">${fmtH(x.over)}</td>
          <td>${OT_REASON[x.kind]}</td>
          <td>${esc(names.join(', '))}</td></tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${fmtH(weekWorked)}</td>
        <td class="n band-over">${fmtH(weekOT)}</td><td colspan="2"></td></tr></tfoot>
    </table>` : `<div class="exportNote">No overtime this week — no day past ${OT.dayStd} hours,
      and no day off worked.</div>`}`;
}
