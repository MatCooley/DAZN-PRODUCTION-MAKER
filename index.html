     Everything around it is pulled back: the greys carry a faint cool
     cast rather than sitting on dead neutral, and text stops short of
     pure white, which is what makes a black interface glare. */
  --bg:#0A0B0C;
  --surface:#121315;
  --surface-2:#191B1D;
  --surface-3:#232629;
  --line:#31353A;
  --line-soft:#212427;
  --text:#F0F1F2;
  --text-2:#B7BCC1;
  --text-3:#878D93;
  --canvas:#151719;
  --well:#000000;

  /* The brand yellow is kept for the two places it means "do this" —
     the primary button and the mark. Selection and focus use a lower
     chroma of the same hue, so the interface isn't lit up in acid
     wherever something happens to be picked. */
  --accent:#F5FF00;
  --accent-ink:#0A0B0C;
  --sel:#DDE256;
  --drop-fill:rgba(221,226,86,.11);
  /* Warnings sit a step off full saturation. They still read as amber
     and red against the muted bars, without the phone-notification
     brightness that made everything else look loud by comparison. */
  --soft:#D2954A;
  --hard:#CF5B50;

  --centre-w:352px;      /* the date control and the search field share it */
  --row-h:52px;
  --name-col:250px;
  --day-min:240px;
  --top-h:44%;
  --radius:3px;
  --gutter:16px;
  --shadow:0 18px 44px rgba(0,0,0,.62);
  --panel-shadow:0 18px 32px -14px rgba(0,0,0,.85);
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--sel);
  /* Seven type sizes, not thirteen. Everything in the app picks one of
     these so the vertical rhythm holds across panes. */
  --t-2xs:10px;
  --t-xs:11px;
  --t-sm:12px;
  --t-md:13px;
  --t-lg:14px;
  --t-xl:15px;
  --t-2xl:18px;

  /* One easing curve and three durations. Anything that moves uses
     these, so the whole interface accelerates and settles together. */
  --ease:cubic-bezier(.2,.7,.3,1);
  --dur-1:.11s;          /* hover, press, colour changes */
  --dur-2:.19s;          /* popovers, cards, panels */
  --dur-3:.28s;          /* modals and anything crossing the screen */

  --now:#92B9C6;         /* the now-line. Cool and quiet — it marks the time, it isn't an alert. */

  --sans:'Zone', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --narrow:'Zone Narrow', 'Zone', ui-sans-serif, system-ui, sans-serif;
  --wide:'Zone Wide', 'Zone', ui-sans-serif, system-ui, sans-serif;
}
[data-theme="light"]{
  --bg:#EAEAE8; --surface:#FDFDFC; --surface-2:#F4F4F2; --surface-3:#E5E5E2;
  --line:#D4D4D0; --line-soft:#E7E7E4;
  --text:#141618; --text-2:#4C5054; --text-3:#6D7276;
  --accent:#F5FF00; --accent-ink:#141618;
  --sel:#141618;                    /* yellow disappears on white, so lines go near-black */
  --drop-fill:rgba(245,255,0,.45);
  --soft:#96601A; --hard:#B04037;
  --canvas:#D5D7D6;
  --well:#DFE1E0;
  --shadow:0 18px 44px rgba(0,0,0,.16);
  --panel-shadow:0 16px 28px -16px rgba(20,30,45,.28);
  --now:#3B6D7B;                    /* the now-line needs weight against white */
}
/* The bar tint sits on a light well here, so the colour has to give way
   to ink for the labels to hold up. */
[data-theme="light"] .wbar{background:color-mix(in srgb,var(--c) 34%,#fff)}
[data-theme="light"] .wbar:hover{background:color-mix(in srgb,var(--c) 48%,#fff)}
[data-theme="light"] .wbar.is-pencil{background:color-mix(in srgb,var(--c) 16%,#fff)}
[data-theme="light"] .wbar__t{color:color-mix(in srgb,var(--c) 40%,var(--text-2))}
[data-theme="light"] .tl-bar{background:color-mix(in srgb,var(--c) 22%,#fff)}
[data-theme="light"] .tl-bar:hover{background:color-mix(in srgb,var(--c) 34%,#fff)}
[data-theme="light"] .is-pending::after{background:linear-gradient(100deg,transparent 20%,rgba(0,0,0,.09) 50%,transparent 80%);background-size:220% 100%}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:var(--t-lg);line-height:1.5;color:var(--text);
  background:var(--canvas);overflow:hidden;display:flex;padding:var(--gutter)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:3px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--narrow);font-variant-numeric:tabular-nums}

/* The roster is a screen sitting inside a frame — the frame (canvas) is
   a distinct neutral tone in both themes, never the same colour as the
   content it holds, so there's always a visible edge between them. */
.app{flex:1;min-width:0;min-height:0;position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.app::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:12;pointer-events:none}
.app>.topbar{grid-row:1;min-width:0}
.app>.toolbar{grid-row:2;min-width:0}
.app>.workspace{grid-row:3}
.app>.tray{grid-row:4}
.app>.showsPage{grid-row:2/5}
.app.is-shows-page .roster-only{display:none}
.app.is-shows-page>.toolbar,.app.is-shows-page>.workspace,.app.is-shows-page>.tray{display:none}
.app.is-month-view{--day-min:104px}
.app.is-month-view .wbar__t{display:none}

/* ---------- top bar ---------- */
/* Brand on the left, utilities on the right, and the controls people
   actually reach for centred between them. The two sides are given the
   same flex basis so the centre stays centred on the window rather than
   drifting with the width of whatever is beside it. */
/* Five slots across the head: brand, section nav, the date control, the
   view switch with Crew beside it, and the display utilities. The four
   flanking slots share the leftover width in equal pairs, which is what
   parks the date control on the window's centre line — the same line the
   search field below it sits on, so the two read as one column. */
.topbar{display:grid;align-items:center;column-gap:14px;padding:0 16px;height:78px;position:relative;z-index:8;
  grid-template-columns:minmax(0,1fr) var(--centre-w) minmax(0,1fr);
  background:linear-gradient(var(--surface-2),var(--surface));box-shadow:var(--panel-shadow)}
.tb-centre{display:flex;align-items:center;justify-content:center}
.tb-side{display:flex;align-items:center;gap:10px;min-width:0}
/* Today and the view switch are part of the date control, so each is
   pushed to the inner edge of its column and ends up hard against it.
   The columns still resolve equal, so the date control stays on the
   centre line with the search field below it. */
.tb-push{flex:1;min-width:0}
.tb-side--l{justify-content:flex-start}
.tb-side--r{justify-content:flex-end}
/* The centre column is reserved even on the shows page, so stepping
   between sections doesn't shuffle everything sideways. */
.app.is-shows-page .tb-centre{visibility:hidden}

/* Crew is a section of the system, not a utility — it gets its own
   weight beside the view switch rather than sitting in a row of
   secondary buttons. */
.crewBtn{display:flex;align-items:center;height:38px;padding:0 16px;flex:none;white-space:nowrap;
  border-radius:var(--radius);border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line));
  background:color-mix(in srgb,var(--accent) 9%,var(--surface-2));
  color:var(--text);font-family:var(--wide);font-weight:700;font-size:var(--t-md);letter-spacing:.03em;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.crewBtn:hover{background:color-mix(in srgb,var(--accent) 17%,var(--surface-2));
  border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}

/* Below this the five columns no longer fit, so the row flows and wraps
   and the date control keeps its place at the head of the second line. */
/* Below this the three columns stop holding a true centre, so both rows
   flow left to right and wrap instead of pretending. */
@media (max-width:1240px){
  .topbar,.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px}
  .tb-push{display:none}
  .topbar{height:auto;padding:10px 16px}
  .app.is-shows-page .tb-centre{display:none}
  .tb-side--r{margin-left:auto}
  .toolbar .tb-side--l{display:none}
  .toolbar .tb-side--r{margin-left:auto}
}
@media (max-width:720px){
  .search{flex:1 1 220px}
  .search input{width:100%}
}
.tb-group{display:flex;align-items:center;gap:10px;flex:none}
.tb-div{width:1px;height:28px;background:var(--line);flex:none}
.brand{display:flex;align-items:center;gap:14px}
.brand__mark{width:50px;height:50px;flex:none;background:var(--text);
  -webkit-mask:var(--dazn-mark) center/contain no-repeat;mask:var(--dazn-mark) center/contain no-repeat}
.brand__name{font-family:var(--wide);font-weight:700;font-size:var(--t-2xl);letter-spacing:.02em}
.datepick{display:flex;align-items:center;justify-content:space-between;gap:6px;width:var(--centre-w);
  height:46px;padding:0 6px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.datepick .iconbtn{width:36px;height:36px}
.weeknav__label{flex:1;min-width:0;text-align:center;padding:0 6px;font-family:var(--wide);font-weight:700;
  font-size:var(--t-2xl);letter-spacing:.01em;line-height:1.15}
.weeknav__label small{display:block;font-family:var(--sans);font-weight:400;font-size:var(--t-sm);
  letter-spacing:0;color:var(--text-3);margin-top:1px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius);color:var(--text-2);flex:none;
  transition:background var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.iconbtn:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface-3));color:var(--text)}
.today-btn{padding:0 13px;height:34px;border-radius:var(--radius);border:1px solid transparent;
  background:var(--surface-2);color:var(--text-2);font-size:var(--t-md);font-weight:500;flex:none}
.today-btn:hover{background:color-mix(in srgb,var(--accent) 12%,var(--surface-3));color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.spacer{flex:1}
.segmented{display:flex;align-items:center;height:34px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:2px;gap:2px;flex:none}
.segmented--wide{width:100%}
.segmented--wide button{flex:1;justify-content:center}
.segmented button{height:100%;padding:0 14px;border-radius:3px;font-size:var(--t-md);color:var(--text-2);white-space:nowrap}
.segmented button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

/* ---------- toolbar ---------- */
/* Same three columns as the head, same centre width: the search field
   and the date control above it are laid on one centre line, so they
   share a left and right edge down the page. */
.toolbar{display:grid;align-items:center;column-gap:14px;padding:11px 16px;background:var(--surface);
  grid-template-columns:minmax(0,1fr) var(--centre-w) minmax(0,1fr);
  border-bottom:1px solid var(--line);box-shadow:var(--panel-shadow);position:relative;z-index:8}
.toolbar .search{justify-self:center}
/* The field holds its own filters. A pill is a filter you can see and
   pull off, which is the whole point of putting them here. */
.search{position:relative;width:var(--centre-w);max-width:100%}
.search__field{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;min-height:32px;
  padding:3px 26px 3px 9px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);cursor:text;
  transition:border-color var(--dur-1) var(--ease)}
.search__field:focus-within{border-color:var(--sel)}
.search__field > svg{color:var(--text-3);flex:none}
.search__tokens{display:contents}
.search input{flex:1;min-width:90px;height:24px;background:none;border:0;font-size:var(--t-md);padding:0}
.search input::placeholder{color:var(--text-3)}
.search.has-tokens input::placeholder{color:transparent}
.search kbd{position:absolute;right:8px;top:7px;font-family:var(--narrow);font-variant-numeric:tabular-nums;
  font-size:var(--t-xs);color:var(--text-3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.token{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 4px 0 7px;border-radius:3px;
  background:var(--surface-3);font-size:var(--t-xs);white-space:nowrap;max-width:190px}
.token__k{color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-size:var(--t-2xs)}
.token__v{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.token--flag{background:color-mix(in srgb,var(--sel) 20%,var(--surface-3))}
.token__x{width:15px;height:15px;display:grid;place-items:center;border-radius:2px;color:var(--text-3);flex:none}
.token__x:hover{color:var(--text);background:var(--surface-2)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:26;padding:4px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:none}
.suggest.is-open{display:block}
.suggest__item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:3px;
  font-size:var(--t-md);color:var(--text-2);text-align:left}
.suggest__item:hover,.suggest__item.is-active{background:var(--surface-3);color:var(--text)}
.suggest__k{font-size:var(--t-2xs);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);
  min-width:74px;flex:none}
.select{height:31px;padding:0 26px 0 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface-2) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath d='M1 3.5 5 7.5 9 3.5' fill='none' stroke='%2371808F' stroke-width='1.4'/%3E%3C/svg%3E") no-repeat right 9px center;
  appearance:none;font-size:var(--t-md)}
.chip{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;
  background:var(--surface-3);border-radius:var(--radius);color:var(--text-2);font-size:var(--t-md);flex:none;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
.chip:active{transform:translateY(1px)}
.chip:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.chip[aria-pressed="true"]{background:var(--surface-3);color:var(--text);border-color:var(--surface-3)}
.chip--warn[aria-pressed="true"]{color:var(--soft);border-color:color-mix(in srgb,var(--soft) 40%,transparent);background:color-mix(in srgb,var(--soft) 12%,transparent)}

.popWrap{position:relative;flex:none}
.popover{position:absolute;top:calc(100% + 11px);right:0;z-index:25;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;min-width:150px;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-5px) scale(.985);transform-origin:top right;
  transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease),visibility var(--dur-2)}
.popover.is-open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.popover::before{content:'';position:absolute;top:-5px;right:9px;width:9px;height:9px;background:var(--surface-2);
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}


/* ---------- workspace split ---------- */
.workspace{display:grid;grid-template-rows:var(--top-h) 7px 1fr;min-height:0;background:var(--bg);margin-top:14px}
.workspace.mode-fac,.workspace.mode-crew{grid-template-rows:1fr}
.workspace.mode-fac #splitter,.workspace.mode-fac #crewPane,
.workspace.mode-crew #splitter,.workspace.mode-crew #facPane{display:none}
.pane{display:flex;flex-direction:column;min-height:0}
.panehead{display:flex;align-items:center;gap:12px;padding:7px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex:none}
.panehead__title{font-family:var(--wide);font-weight:700;font-size:var(--t-sm);letter-spacing:.04em}
.panehead__meta{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-3)}
.panehead .select{height:27px;font-size:var(--t-sm)}
.panehead__right{margin-left:auto;display:flex;align-items:center;gap:8px}
.paneScroll{flex:1;overflow:auto;min-height:0}
.splitter{background:var(--line);cursor:row-resize;position:relative}
.splitter::after{content:'';position:absolute;left:50%;top:2px;width:36px;height:3px;margin-left:-18px;border-radius:2px;background:var(--surface-3)}
.splitter:hover{background:var(--sel)}

/* ---------- shared grid ---------- */
.grid{min-width:max-content}
.row{display:grid;grid-template-columns:var(--name-col) repeat(var(--days),minmax(var(--day-min),1fr))}
.dayhead{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.dayhead .corner{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:7px 13px;display:flex;align-items:center}
.corner__meta{font-size:var(--t-sm);color:var(--text-3)}
.corner__print{margin-left:auto}
.dayhead__cell{position:relative;padding:7px 12px;border-right:1px solid var(--line-soft)}
.dayhead__cell:last-child{border-right:0}
.dayhead__cell.is-today{background:rgba(255,255,255,.05);box-shadow:inset 2px 0 0 var(--sel)}
.dayhead__top{display:flex;align-items:baseline;gap:7px}
/* The date is the one place this interface is allowed to be loud: it
   answers "where am I" before anything else on the screen does. */
.dayhead__dow{font-family:var(--wide);font-weight:700;font-size:var(--t-lg);letter-spacing:-.01em}
.dayhead__date{font-family:var(--narrow);font-variant-numeric:tabular-nums;font-size:var(--t-sm);
  color:var(--text-3);letter-spacing:.01em}
.dayhead__cell.is-today .dayhead__dow{color:var(--sel)}
.dayhead__sub{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-3);margin-top:2px}
.dayhead__sub.is-short{color:var(--soft)}
.dayhead__print{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:3px;
  color:var(--text-3);opacity:0;transition:opacity var(--dur-1) var(--ease),color var(--dur-1) var(--ease),
  background var(--dur-1) var(--ease)}
.dayhead__cell:hover .dayhead__print{opacity:1}
.dayhead__print:hover{color:var(--text);background:var(--surface-3)}
.dayhead__print:focus-visible{opacity:1}
@media (hover:none){.dayhead__print{opacity:1}}

.grouprow{grid-column:1/-1;position:sticky;left:0;display:flex;align-items:center;gap:10px;padding:9px 13px 5px;
  background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.grouprow:hover{background:var(--surface-3)}
/* A studio group names what's under it — there is nothing to click. */
.grouprow--static{cursor:default}
.grouprow--static:hover{background:var(--surface-2)}
.grouprow__caret{transition:transform .16s ease;color:var(--text-3)}
.grouprow.is-collapsed .grouprow__caret{transform:rotate(-90deg)}
.grouprow__name{font-weight:700;font-size:var(--t-md)}
.grouprow__warn{color:var(--hard);font-size:var(--t-sm);display:inline-flex;align-items:center;gap:4px}

.empsub{grid-column:1/-1;position:sticky;left:0;display:flex;align-items:center;gap:7px;
  padding:4px 13px 4px 27px;background:var(--surface);border-bottom:1px solid var(--line-soft);width:100%}
.empsub span:first-child{font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;color:var(--text-3)}

.lane{box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--line-soft) 55%,transparent);min-height:var(--row-h)}
.lane:hover .namecell{background:var(--surface-2)}
.namecell{line-height:1.35;position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:6px 12px}
.namecell__body{min-width:0;flex:1}
.namecell__name{display:block;font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The one line under a name is the number a coordinator reads on every
   pass, so it gets the body face at body size rather than a caption. */
.namecell__sub{font-variant-numeric:tabular-nums;font-size:var(--t-md);
  color:var(--text-2);display:flex;flex-direction:column;gap:3px;margin-top:4px}
/* Standard is quiet, reasonable additional is worth noticing, past that
   it reads like the warning it is. */
.hoursrow{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.hoursrow__h{font-weight:600}
.hoursrow__of{color:var(--text-3);font-size:var(--t-sm)}
.hoursrow.band-extra .hoursrow__h{color:var(--text)}
.hoursrow.band-over .hoursrow__h{color:var(--soft)}
.hoursrow__m{font-size:var(--t-xs);font-weight:700;letter-spacing:.03em;padding:1px 5px;border-radius:2px;
  background:var(--surface-3);color:var(--text-2)}
.hoursrow.band-over .hoursrow__m{background:color-mix(in srgb,var(--soft) 22%,transparent);color:var(--soft)}
.rdoflag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:2px;flex:none;
  background:color-mix(in srgb,var(--hard) 20%,transparent);color:var(--hard);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.offflag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:2px;flex:none;
  background:var(--surface-3);color:var(--text-3);font-size:var(--t-xs);white-space:nowrap}
.namecell__flag{color:var(--soft);flex:none}
.namecell__flag--hard{color:var(--hard)}
.namecell__month{color:var(--text-3);white-space:nowrap}

.cell{position:relative;border-right:1px solid var(--line-soft);min-width:0;background:var(--well);overflow:hidden}
.cell:last-child{border-right:0}
.cell.is-today{box-shadow:inset 2px 0 0 var(--sel),inset 0 0 0 9999px rgba(255,255,255,.035)}
/* ---------- drop verdicts ----------
   Painted across every target the moment a drag starts: where it can
   go, where it would be tight against the ten-hour break, and where
   someone or something is already committed. */
.cell.is-dropping,.tl-lane.is-dropping{background:var(--drop-fill)}
.cell.is-tight,.tl-lane.is-tight{background:color-mix(in srgb,var(--soft) 12%,transparent)}
.cell.is-busy,.tl-lane.is-busy,.cell.is-invalid,.tl-lane.is-invalid{opacity:.34}
.cell.is-over,.tl-lane.is-over{box-shadow:inset 0 0 0 2px var(--sel)}
[data-booking].is-invalid,[data-booking].is-busy{opacity:.3}
[data-booking].is-over{box-shadow:0 0 0 2px var(--sel)}
body.is-dragging-any .cellGrid,body.is-dragging-any .tl-lane__grid{opacity:.4}
.cell.is-invalid{background:color-mix(in srgb,var(--hard) 14%,transparent);box-shadow:inset 0 0 0 1px var(--hard)}
.cell__add{position:absolute;inset:auto 4px 4px auto;width:19px;height:19px;border-radius:3px;display:grid;place-items:center;
  color:var(--text-3);background:var(--surface-2);border:1px solid var(--line);opacity:0;transition:opacity .12s ease;z-index:2}
.cell:hover .cell__add{opacity:1}
.cell__add:hover{color:var(--text);background:var(--surface-3)}

/* ---------- the ruler ----------
   A gallery clock is read by shape before it is read by number: the
   working day is a lit band, six-hourly marks are the rules you count
   from, and the hours between them are ticks. */
.cellGrid,.tl-lane__grid{position:absolute;inset:0;pointer-events:none}
.cellGrid span,.tl-lane__grid span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.cellGrid span.is-major,.tl-lane__grid span.is-major{border-left-color:color-mix(in srgb,var(--line) 80%,var(--text-3))}
.band{position:absolute;top:0;bottom:0;border:0 !important;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.014))}
[data-theme="light"] .band{background:rgba(255,255,255,.55)}

/* Week-view bars: positioned and sized by actual time, wide enough
   (min-width, below) to carry a compact time + name label. */
.wbar{position:absolute;top:6px;bottom:6px;min-width:66px;border-radius:2px;cursor:grab;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  background:color-mix(in srgb,var(--c) 34%,var(--well));
  overflow:hidden;padding:3px 6px 3px 9px;text-align:left;
  transition:background var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
/* The show's colour lives on a 3px edge and in the time label rather
   than across the whole fill, so a lane of bars reads as a schedule
   instead of a row of highlighter strokes — and the amber and red
   clash outlines stay legible on top of any palette entry. */
.wbar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.wbar:hover{background:color-mix(in srgb,var(--c) 46%,var(--well))}
.wbar:active{transform:translateY(.5px)}
.wbar.is-selected{box-shadow:0 0 0 2px var(--sel)}
.wbar.is-pencil{background:color-mix(in srgb,var(--c) 17%,var(--well));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.wbar.is-pencil::before{background:repeating-linear-gradient(180deg,var(--c) 0 4px,transparent 4px 7px)}
.wbar.is-open{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:none}
.wbar.is-open::before{display:none}
.wbar.is-open .wbar__t{color:var(--text-3)}
.wbar.is-open .wbar__n{color:var(--text-2);text-shadow:none}
/* A shift someone gave up a day off for, marked so it reads on the
   roster without opening anything. */
/* A marked day off. Deliberately not a bar — nothing is being worked —
   so it reads as a ruled-off span rather than a booking. */
.offbar{position:absolute;top:8px;bottom:8px;border-radius:2px;cursor:pointer;
  border:1px dashed color-mix(in srgb,var(--text-3) 60%,transparent);
  background:repeating-linear-gradient(135deg,transparent,transparent 5px,
    color-mix(in srgb,var(--text-3) 12%,transparent) 5px,
    color-mix(in srgb,var(--text-3) 12%,transparent) 10px);
  display:flex;align-items:center;justify-content:center;
  transition:border-color var(--dur-1) var(--ease)}
.offbar:hover{border-color:var(--text-2)}
.offbar__l{font-family:var(--narrow);font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;
  color:var(--text-3)}
.rdoAdd{flex:none;padding:2px 7px;border-radius:2px;background:var(--surface-3);color:var(--text-3);
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;opacity:0;
  transition:opacity var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.lane:hover .rdoAdd,.tl-row:hover .rdoAdd,.rdoAdd:focus-visible{opacity:1}
.rdoAdd:hover{color:var(--text);background:var(--surface)}
@media (hover:none){.rdoAdd{opacity:1}}

.wbar.is-rdo::after,.tl-bar.is-rdo::after{content:'RDO';position:absolute;top:2px;right:3px;
  font-family:var(--narrow);font-size:9px;font-weight:700;letter-spacing:.04em;
  color:var(--hard);pointer-events:none}
.wbar.is-hard{outline:1.5px solid var(--hard)}
.wbar.is-soft{outline:1.5px solid var(--soft)}
.wbar.is-dragging{opacity:.3}
.wbar.is-glow{box-shadow:0 0 0 1.5px var(--c),0 0 11px 1px color-mix(in srgb,var(--c) 70%,transparent);z-index:2}
.wbar.is-glow.is-selected{box-shadow:0 0 0 1.5px var(--c),0 0 13px 2px var(--c),0 0 0 3.5px var(--sel)}
/* The name leads. The hours are the qualifier, and the bar's position
   on the ruler already says roughly when it runs. */
.wbar__n{position:relative;z-index:1;display:block;font-size:var(--t-sm);line-height:1.25;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.wbar__t{position:relative;z-index:1;display:block;font-family:var(--narrow);font-size:var(--t-2xs);
  line-height:1.3;font-variant-numeric:tabular-nums;color:var(--text-3);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden}
/* A shift whose call-to-wrap window outlasts its booking: the bar itself
   is a muted span for the full shift, with a bright strip along the
   bottom marking when the booking is actually on air. */
.wbar.has-on-air{background:color-mix(in srgb,var(--c) 14%,var(--well));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.wbar__on{position:absolute;left:0;bottom:0;height:4px;background:var(--c);border-radius:0 0 2px 2px}

/* ---------- blocks ---------- */
.block{line-height:1.34;position:relative;display:block;width:100%;text-align:left;padding:5px 8px 5px 11px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--line);cursor:grab;overflow:hidden;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
.block::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--text-3))}
.block:hover{background:var(--surface-3);border-color:var(--surface-3)}
.block.is-selected{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.block.is-pencil,.block.is-draft{border-style:dashed}
.block:active{transform:translateY(.5px)}
.block.is-dragging{opacity:.35;cursor:grabbing;transform:scale(.985)}
.block.is-glow{border-color:var(--c);box-shadow:0 0 12px 1px var(--c)}
.block__t{display:block;font-variant-numeric:tabular-nums;font-size:var(--t-sm);font-weight:400;color:var(--text-2)}
.block__n{display:block;font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block__s{display:block;font-size:var(--t-sm);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark-warn{color:var(--soft);display:block}
.mark-hard{color:var(--hard);display:block}
.block--open{background:transparent;border-style:dashed;border-color:color-mix(in srgb,var(--c) 55%,var(--line))}

.app.is-compact{--row-h:36px}
.app.is-compact .block{padding:3px 7px 3px 10px}
.app.is-compact .block__s{display:none}
.app.is-compact .wbar__t{display:none}

/* ---------- day view ---------- */
.tl-hours{position:relative;height:34px;min-width:1120px}
.tl-hour{position:absolute;top:18px;bottom:0;border-left:1px solid var(--line-soft);
  padding:0 0 0 5px;font-family:var(--narrow);font-variant-numeric:tabular-nums;
  font-size:var(--t-xs);color:transparent}
.tl-hour.is-major{top:6px;border-left-color:color-mix(in srgb,var(--line) 85%,var(--text-3));
  font-size:var(--t-sm);color:var(--text-2)}
.tl-row{display:grid;grid-template-columns:var(--name-col) 1fr}
.tl-lane{position:relative;min-width:1120px;height:var(--row-h);border-bottom:1px solid var(--line-soft);background:var(--well)}
.tl-lane.is-invalid{background:color-mix(in srgb,var(--hard) 12%,transparent)}
.tl-bar{line-height:1.3;position:absolute;top:5px;bottom:5px;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  background:color-mix(in srgb,var(--c) 24%,var(--surface-2));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));
  padding:3px 8px 3px 10px;cursor:grab;text-align:left;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}
.tl-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
/* Grab either end to change the hours. Wide enough to hit, invisible
   until the bar is under the pointer. */
/* Purely a sign that the end is live — the bar decides where its edges
   are, so nothing here needs to be clickable. */
.grip{position:absolute;top:2px;bottom:2px;width:5px;border-radius:2px;pointer-events:none;
  background:var(--text);opacity:0;transition:opacity var(--dur-1) var(--ease)}
.grip--s{left:1px}
.grip--e{right:1px}
.is-edge-s .grip--s,.is-edge-e .grip--e{opacity:.9}
.is-edge-s,.is-edge-e{cursor:ew-resize}
.tl-bar.is-resizing,.wbar.is-resizing{box-shadow:0 0 0 1.5px var(--sel);cursor:ew-resize;z-index:5}
body.is-resizing-any{cursor:ew-resize;user-select:none}
body.is-resizing-any .tl-bar:not(.is-resizing),
body.is-resizing-any .wbar:not(.is-resizing){pointer-events:none}
.tl-bar.is-resizing .tl-bar__t,.wbar.is-resizing .wbar__t{color:var(--text)}
.tl-bar:hover{background:color-mix(in srgb,var(--c) 38%,var(--surface-2))}
.tl-bar.is-selected{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.tl-bar.is-pencil,.tl-bar.is-draft{border-style:dashed}
.tl-bar.is-glow{border-color:var(--c);box-shadow:0 0 12px 1px color-mix(in srgb,var(--c) 70%,transparent);z-index:2}
.tl-bar__n{font-size:var(--t-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block;letter-spacing:-.005em}
.tl-bar__t{font-family:var(--narrow);font-variant-numeric:tabular-nums;font-size:var(--t-xs);font-weight:500;
  display:block;white-space:nowrap;overflow:hidden;color:var(--text-3);letter-spacing:.01em}

/* ---------- tray ---------- */
.tray{background:var(--surface);border-top:1px solid var(--line);display:flex;min-height:72px;max-height:72px}
.tray__label{flex:none;width:var(--name-col);padding:11px 13px;border-right:1px solid var(--line)}
.tray__title{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em}
.tray__hint{font-size:var(--t-sm);color:var(--text-3);margin-top:1px}
.tray__scroll{flex:1;display:flex;gap:8px;align-items:center;padding:0 13px;overflow-x:auto}
.tray .block{width:auto;min-width:188px;flex:none}
.tray__empty{color:var(--text-3);font-size:var(--t-md)}
.tray.is-dropping{background:var(--drop-fill)}

/* ---------- shows page ---------- */
.showsPage{display:none;min-height:0;background:var(--bg)}
.app.is-shows-page .showsPage{display:flex;flex-direction:column}
.showsPage__scroll{flex:1;overflow:auto;min-height:0;margin-top:14px}
.pageHead{display:flex;align-items:center;gap:14px;padding:22px 28px 4px;flex-wrap:wrap}
.pageTitle{font-family:var(--wide);font-weight:700;font-size:var(--t-xl);letter-spacing:.03em}
.pageHead__meta{font-size:var(--t-sm);color:var(--text-3)}
.pageHead__right{margin-left:auto}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:var(--t-md)}
.back-link:hover{color:var(--text)}

.showGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px 28px 32px}
.showCard{position:relative;text-align:left;padding:16px 16px 14px 19px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);cursor:pointer}
.showCard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);border-radius:var(--radius) 0 0 var(--radius)}
.showCard:hover{background:var(--surface-2);border-color:var(--surface-3)}
.showCard__name{font-size:var(--t-xl);font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.showCard__row{display:flex;align-items:center;gap:7px;font-size:var(--t-sm);color:var(--text-2);margin-bottom:5px}
.showCard__row svg{flex:none;color:var(--text-3)}
.showCard__foot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:var(--t-sm);color:var(--text-3)}

.showEditor{max-width:980px;margin:0 auto;padding:8px 28px 60px}
.showEditor__head{display:flex;align-items:flex-start;gap:14px;padding:14px 0 18px;flex-wrap:wrap}
.showEditor__name{flex:1;min-width:220px}
.showEditor__name input{width:100%;height:40px;font-size:var(--t-2xl);font-weight:600;background:transparent;
  border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 0 4px}
.showEditor__name input:focus-visible{outline:none;border-color:var(--sel);box-shadow:none;border-radius:0}
.showEditor__actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.showEditor__grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
@media (max-width:880px){.showEditor__grid{grid-template-columns:1fr}}
.showEditor__grid .sechead{margin-top:22px}
.showEditor__grid .sechead:first-child{margin-top:0}

.chipRow{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.swatch.is-selected{border-color:var(--text)}

.rundownRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.rundownRow:last-child{border-bottom:0}
.rundownRow__num{width:16px;flex:none;font-family:var(--narrow);font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-3)}
.rundownRow input{height:32px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:0 8px;font-size:var(--t-md)}
.rundownRow input.rd-time{width:66px;font-family:var(--narrow);font-variant-numeric:tabular-nums;flex:none}
.rundownRow input.rd-title{flex:1;min-width:0}
.rundownRow input.rd-dur{width:56px;flex:none}
.rundownRow__moves{display:flex;flex-direction:column;flex:none}
.rundownRow__moves button{width:18px;height:14px;display:grid;place-items:center;color:var(--text-3)}
.rundownRow__moves button:hover{color:var(--text)}
.rundownRow__moves button:disabled{opacity:.3;cursor:default}
.rundownRow__del{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:3px;color:var(--text-3)}
.rundownRow__del:hover{color:var(--hard);background:var(--surface-3)}
.showEditor__sub{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.showEditor__meta{font-size:var(--t-sm);color:var(--text-3)}
.pill{font-size:var(--t-xs);padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text-3)}
.pill--dirty{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 10%,transparent)}
.posHead{display:grid;grid-template-columns:1fr 150px 92px 26px;gap:8px;padding-bottom:6px;
  font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.posRow{display:grid;grid-template-columns:1fr 150px 92px 26px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-soft)}
.posRow:last-of-type{border-bottom:0}
.posRow__role{min-width:0}
.posRow__role b{display:block;font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posRow__role small{display:block;font-size:var(--t-xs);color:var(--text-3);font-variant-numeric:tabular-nums}
.posRow__who{height:30px;width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--text);font-size:var(--t-sm);padding:0 8px}
.posRow--open .posRow__who{color:var(--soft);border-style:dashed}
.offs{display:flex;gap:6px}
.offs input{width:43px;height:30px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--text);font-size:var(--t-sm);padding:0 6px;
  font-variant-numeric:tabular-nums;text-align:center}
.posRow__x{width:26px;height:26px;display:grid;place-items:center;border-radius:3px;color:var(--text-3)}
.posRow__x:hover{color:var(--hard);background:var(--surface-3)}
.airing{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;background:var(--surface-2)}
.airing:hover{border-color:var(--sel)}
.airing__d{font-size:var(--t-sm);font-weight:600;width:86px;flex:none}
.airing__t{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-2);flex:none}
.airing__s{font-size:var(--t-xs);color:var(--text-3)}
.airing__m{margin-left:auto;font-size:var(--t-xs);color:var(--text-3);text-align:right}
.saveBar{position:sticky;bottom:12px;z-index:5;margin-top:26px;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;padding:13px 16px;background:var(--surface-2);border-radius:var(--radius);
  border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--shadow)}
.saveBar__t{font-size:var(--t-md);font-weight:600}
.saveBar__r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saveBar__scope{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--text-2)}
.saveBar__scope .select{height:31px}
.chgList{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;max-width:520px}
.chg{font-size:var(--t-xs);color:var(--text-2);background:var(--surface-3);border-radius:2px;padding:3px 8px}
@media (max-width:880px){.posHead,.posRow{grid-template-columns:1fr 118px 78px 24px}
  .saveBar__r{margin-left:0;width:100%}}

/* ---------- crew modal ---------- */
.modalBackdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:32px}
.modalBackdrop.is-open{display:flex;animation:scrim-in var(--dur-2) var(--ease) both}
.modalBackdrop.is-open .modal{animation:modal-in var(--dur-3) var(--ease) both}
@keyframes scrim-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
[data-theme="light"] .modalBackdrop{background:rgba(20,24,30,.42)}
.modal{width:100%;max-width:1160px;max-height:calc(100vh - 64px);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.modal__head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.modal__title{font-family:var(--wide);font-weight:700;font-size:var(--t-lg);letter-spacing:.03em}
.modal__meta{font-size:var(--t-sm);color:var(--text-3)}
.modal__body{flex:1;overflow:auto;min-height:0}

.crewToolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.crewToolbar__right{margin-left:auto;display:flex;gap:8px}
.crewToolbar .chk{display:flex;align-items:center;gap:6px;font-size:var(--t-md);color:var(--text-2);cursor:pointer;white-space:nowrap}
.crewToolbar .chk input{accent-color:var(--sel)}

.statStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.statCard{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2)}
.statCard--btn{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.statCard--btn[aria-pressed="true"]{border-color:var(--sel);background:var(--surface-3)}
.statCard__n{font-variant-numeric:tabular-nums;font-size:var(--t-2xl);font-weight:700;letter-spacing:-.01em}
.statCard__n.is-warn{color:var(--soft)}
.statCard__l{font-size:var(--t-xs);color:var(--text-3);margin-top:1px}

.crewLayout{display:grid;grid-template-columns:1fr}
.crewList{min-width:0}
.crewHead,.crewRow{display:grid;grid-template-columns:minmax(170px,1.7fr) 92px minmax(160px,1.7fr) 88px 112px 20px;
  gap:10px;align-items:center;padding:9px 18px}
.crewHead{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:var(--t-xs);color:var(--text-3);font-weight:600;letter-spacing:.02em;z-index:1}
.crewRow{border-bottom:1px solid var(--line-soft);cursor:pointer;text-align:left;width:100%;background:none}
.crewRow:hover{background:var(--surface-2)}
.crewRow__name{display:flex;align-items:center;gap:9px;min-width:0}
.crewRow__name .namecell__name{font-size:var(--t-md)}
.crewRow__dept{font-size:var(--t-sm);color:var(--text-2)}
.crewRow__roles{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.roleTag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:3px;
  font-size:var(--t-xs);color:var(--text-2);background:var(--surface-3);white-space:nowrap}
.empTag{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:3px;font-size:var(--t-xs);font-weight:600}
.empTag--fulltime{background:color-mix(in srgb,var(--sel) 16%,transparent);color:var(--text)}
[data-theme="dark"] .empTag--fulltime{color:var(--accent)}
.empTag--freelance{background:var(--surface-3);color:var(--text-2)}
.crewRow__hrs{font-variant-numeric:tabular-nums;font-size:var(--t-sm);white-space:nowrap;line-height:1.4}
.crewRow__hrs .band-extra{color:var(--text)}
.crewRow__hrs .band-over{color:var(--soft);font-weight:600}
.crewRow__ot{font-size:var(--t-xs);color:var(--text-3)}


.crewDetail{max-width:900px;margin:0 auto;padding:8px 24px 32px}
.crewDetail__head{display:flex;align-items:flex-start;gap:14px;padding:14px 0 18px;flex-wrap:wrap}
.crewDetail__name{flex:1;min-width:200px}
.crewDetail__name input{width:100%;height:38px;font-size:var(--t-xl);font-weight:600;background:transparent;
  border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 0 4px}
.crewDetail__name input:focus-visible{outline:none;border-color:var(--sel);box-shadow:none;border-radius:0}
.crewDetail__actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.crewDetail__grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
@media (max-width:760px){.crewDetail__grid{grid-template-columns:1fr}}

.posRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.posRow:last-child{border-bottom:0}
.posRow select{flex:1;min-width:0}
.posRow input.rateInput{width:84px;flex:none;height:32px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--radius);padding:0 8px;font-size:var(--t-md)}
.posRow__prefix{font-size:var(--t-sm);color:var(--text-3);flex:none}
.posRow__x{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:3px;color:var(--text-3)}
.posRow__x:hover{color:var(--hard);background:var(--surface-3)}


/* ---------- booking / shift modal ---------- */
.modal--insp{max-width:960px}
.inspDetail{padding:4px 28px 30px}
.inspDetail__head{display:flex;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line-soft);margin-bottom:22px;flex-wrap:wrap}
.inspDetail__title{flex:1;min-width:220px}
.inspDetail__name{display:flex;align-items:center;gap:11px}
.inspDetail__name input{flex:1;min-width:0;height:38px;font-size:var(--t-2xl);font-weight:600;background:transparent;
  border:0;border-bottom:2px solid var(--line);border-radius:0;padding:0 0 4px}
.inspDetail__name input:focus-visible{outline:none;border-color:var(--sel);box-shadow:none;border-radius:0}
.inspDetail__actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:3px}
.inspDetail__grid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.inspDetail__grid.is-single{grid-template-columns:1fr;max-width:480px}
@media (max-width:760px){.inspDetail__grid{grid-template-columns:1fr}}
.dot{width:11px;height:11px;border-radius:3px;flex:none;background:var(--c)}
.field{margin-bottom:15px}
.field__label{font-size:var(--t-sm);color:var(--text-3);margin-bottom:5px}
.field__value{font-size:var(--t-lg)}
.field .select,.field input,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:0 10px;height:34px}
.field__static{width:100%;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--text-2);
  border-radius:var(--radius);padding:0 10px;height:34px;display:flex;align-items:center;box-sizing:border-box}
.field textarea{padding:8px 10px;height:auto;min-height:58px;resize:vertical}
.field__2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checklist{display:grid;gap:2px;max-height:174px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:6px;background:var(--surface-2)}
.checklist__group{font-size:var(--t-xs);font-weight:700;color:var(--text-3);letter-spacing:.02em;padding:6px 6px 2px}
.checklist__group:first-child{padding-top:2px}
.checkitem{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 16px;border-radius:3px;font-size:var(--t-md);cursor:pointer}
.checkitem:hover{background:var(--surface-3)}
.checkitem input{width:auto;height:auto;accent-color:var(--sel)}
.checkitem small{margin-left:auto;color:var(--hard);font-size:var(--t-sm)}

.crewline{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;background:var(--surface-2)}
.crewline__body{min-width:0;flex:1}
.crewline__n{display:block;font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewline__r{display:block;font-size:var(--t-sm);color:var(--text-3)}
.crewline__t{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-2)}
.crewline--open{border-style:dashed;background:transparent}
.crewline__x{color:var(--text-3);width:22px;height:22px;display:grid;place-items:center;border-radius:3px;flex:none}
.crewline__x:hover{color:var(--hard);background:var(--surface-3)}

.conflict{display:flex;gap:9px;padding:9px 10px;border-radius:var(--radius);margin-bottom:7px;
  background:color-mix(in srgb,var(--soft) 11%,transparent);border:1px solid color-mix(in srgb,var(--soft) 30%,transparent)}
.conflict svg{color:var(--soft);flex:none;margin-top:1px}
.conflict--hard{background:color-mix(in srgb,var(--hard) 11%,transparent);border-color:color-mix(in srgb,var(--hard) 32%,transparent)}
.conflict--hard svg{color:var(--hard)}
.conflict__t{font-size:var(--t-md);font-weight:500}
.conflict__d{font-size:var(--t-sm);color:var(--text-2);margin-top:1px}
.empty-note{color:var(--text-3);font-size:var(--t-md)}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;padding-top:15px;border-top:1px solid var(--line-soft)}
.sechead h3{font-size:var(--t-md);font-weight:600;margin:0;letter-spacing:-.01em}
.sechead span{font-variant-numeric:tabular-nums;font-size:var(--t-sm);color:var(--text-3)}

.btn{height:31px;padding:0 12px;border-radius:var(--radius);border:1px solid transparent;
  background:var(--surface-3);color:var(--text-2);font-size:var(--t-md);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),transform var(--dur-1) var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn--primary:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.btn--danger:hover{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 45%,transparent)}
.btn--sm{height:27px;padding:0 9px;font-size:var(--t-sm)}

/* ---------- toast ---------- */
.toast{position:fixed;left:calc(var(--gutter) + 16px);bottom:calc(var(--gutter) + 88px);z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:var(--radius);background:var(--surface-3);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:var(--t-md);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.toast.is-visible{opacity:1;transform:none;pointer-events:auto}
.toast__undo{color:var(--sel);font-weight:700;font-size:var(--t-md)}

@keyframes today-in{from{box-shadow:inset 2px 0 0 transparent}to{box-shadow:inset 2px 0 0 var(--sel)}}
.dayhead__cell.is-today{animation:today-in .5s .15s ease both}
/* ---------- hover card ----------
   Replaces the native title tooltip on every bar and block. The OS
   tooltip arrives a second late in the wrong font and can't show a
   crew list or a clash reason, which is most of what you want when
   you're skimming a lane. */
.hovercard{position:fixed;z-index:60;width:284px;padding:12px 13px 11px;pointer-events:none;
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
  opacity:0;transform:translateY(4px);transition:opacity var(--dur-2) var(--ease),transform var(--dur-2) var(--ease)}
.hovercard.is-visible{opacity:1;transform:none}
.hovercard__head{display:flex;align-items:baseline;gap:8px}
.hovercard__dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--text-3));flex:none;transform:translateY(-1px)}
.hovercard__name{font-size:var(--t-md);font-weight:700;letter-spacing:-.01em;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hovercard__sub{font-size:var(--t-xs);color:var(--text-3);margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.hovercard__rows{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.hovercard__row{display:flex;gap:10px;font-size:var(--t-sm)}
.hovercard__k{color:var(--text-3);width:74px;flex:none}
.hovercard__v{color:var(--text-2);min-width:0;flex:1;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;word-break:break-word}
.hovercard__crew{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:4px}
.hovercard__more{font-size:var(--t-xs);color:var(--text-3);align-self:center}
.namecell[data-staffname]{cursor:grab}
.namecell[data-staffname]:active{cursor:grabbing}
.namecell[data-staffname].is-dragging{opacity:.45}
.namecell[data-staffname]:hover .namecell__name{color:var(--text)}
.hovercard__v .band-over{color:var(--soft)}
.hovercard__v .band-extra{color:var(--text)}
.hovercard__notes{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);
  font-size:var(--t-sm);line-height:1.45;color:var(--text-2);white-space:pre-wrap}
.hovercard__notes b{color:var(--text-3);font-weight:600}
.hovercard__notes + .hovercard__notes{margin-top:6px;padding-top:6px}
.hovercard__flag{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
  display:flex;gap:7px;font-size:var(--t-sm);color:var(--soft)}
.hovercard__flag--hard{color:var(--hard)}
.hovercard__flag svg{flex:none;margin-top:2px}

/* A monogram carries a person in less width than a name, which is what
   the crew strip on a hover card and the print sheet both need. */
.mono{display:inline-flex;align-items:center;gap:5px;padding:2px 7px 2px 2px;border-radius:999px;
  background:var(--surface-3);font-size:var(--t-xs);color:var(--text-2);max-width:100%}
.mono__i{width:17px;height:17px;border-radius:999px;display:grid;place-items:center;flex:none;
  font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--accent-ink);
  background:hsl(var(--h,210) 26% 58%)}
.mono--open .mono__i{background:transparent;border:1px dashed var(--line);color:var(--text-3)}
.mono__n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- now-line ---------- */
.nowline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--now);z-index:4;
  pointer-events:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--now) 22%,transparent),
  0 0 9px color-mix(in srgb,var(--now) 45%,transparent)}
/* Anchored to the line rather than centred on it, so the two read as
   one marker instead of a label that happens to be nearby. */
.nowflag{position:absolute;top:0;z-index:7;transform:translateX(-1px);pointer-events:none;
  font-family:var(--wide);font-variant-numeric:tabular-nums;font-size:var(--t-2xl);font-weight:700;
  line-height:1;letter-spacing:.01em;color:var(--well);background:var(--now);
  border-radius:0 3px 3px 0;padding:5px 9px 6px 7px;
  box-shadow:0 2px 10px rgba(0,0,0,.45)}

/* ---------- sticky column scroll shadow ---------- */
.paneScroll .namecell,.paneScroll .corner,.paneScroll .grouprow,.paneScroll .empsub{
  transition:box-shadow var(--dur-2) var(--ease)}
.paneScroll.has-xscroll .namecell,.paneScroll.has-xscroll .corner{box-shadow:7px 0 14px -9px rgba(0,0,0,.95)}
[data-theme="light"] .paneScroll.has-xscroll .namecell,
[data-theme="light"] .paneScroll.has-xscroll .corner{box-shadow:7px 0 13px -10px rgba(20,24,30,.5)}

/* ---------- empty states ---------- */
.emptyState{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:44px 24px;text-align:center;color:var(--text-3)}
.emptyState__icon{color:var(--line);margin-bottom:4px}
.emptyState__title{font-size:var(--t-md);font-weight:600;color:var(--text-2)}
.emptyState__sub{font-size:var(--t-sm);max-width:330px;line-height:1.45}
.emptyState .btn{margin-top:10px}

/* ---------- figures ----------
   A number, what it is measured against, and where it sits. Read in
   that order, so the figure carries and the qualifier follows. */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-bottom:4px}
.figure{padding:11px 12px;background:var(--surface-2);border-radius:var(--radius);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.figure b{display:block;font-family:var(--wide);font-weight:700;font-size:var(--t-2xl);
  font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.01em}
.figure span{display:block;font-size:var(--t-xs);color:var(--text-3);margin-top:4px}
.figure em{display:block;font-style:normal;font-size:var(--t-2xs);color:var(--text-3);margin-top:3px}
.figure.band-extra b{color:var(--text)}
.figure.band-extra em{color:var(--text-2)}
.figure.band-over b,.figure.band-over em{color:var(--soft)}

.otTable{width:100%;border-collapse:collapse;margin-top:2px}
.otTable th{text-align:left;font-size:var(--t-xs);font-weight:600;color:var(--text-3);
  padding:0 8px 5px 0;box-shadow:inset 0 -1px 0 var(--line-soft)}
.otTable td{padding:6px 8px 6px 0;font-size:var(--t-sm);
  box-shadow:inset 0 -1px 0 var(--line-soft);vertical-align:top}
.otTable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.otTable td.band-over{color:var(--soft)}
.otTable tfoot td{font-weight:700;box-shadow:none}

/* ---------- roster export ---------- */
.exportMeta{font-size:var(--t-sm);color:var(--text-2);font-variant-numeric:tabular-nums;margin:-6px 0 10px}
/* ---------- a checkbox that explains itself ---------- */
.checkline{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;margin-top:2px;
  background:var(--surface-2);border-radius:var(--radius);cursor:pointer}
.checkline input{margin-top:2px;accent-color:var(--sel);flex:none}
.checkline b{display:block;font-size:var(--t-md);font-weight:600}
.checkline small{display:block;font-size:var(--t-xs);color:var(--text-3);line-height:1.45;margin-top:2px}

.exportRow{display:flex;gap:8px;flex-wrap:wrap}
/* 24-hour clock fields — see normaliseTime(). */
.tf{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tf.is-bad{border-color:var(--hard);color:var(--hard)}
.txRow{display:grid;grid-template-columns:1fr 88px 88px 1fr 26px;gap:6px;align-items:center;margin-bottom:6px}
.txRow .select,.txRow input{height:30px;font-size:var(--t-sm);width:100%;min-width:0}
.feedRow{display:flex;gap:8px}
.feedRow input{flex:1;min-width:0;font-family:var(--narrow);font-size:var(--t-sm);color:var(--text-3)}
.exportNote{font-size:var(--t-xs);color:var(--text-3);line-height:1.5;margin-top:10px}

/* ---------- pending (optimistic) ---------- */
.is-pending{position:relative;overflow:hidden}
.is-pending::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.13) 50%,transparent 80%);
  background-size:220% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{from{background-position:180% 0}to{background-position:-80% 0}}

/* ---------- command palette ---------- */
.paletteBackdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;
  align-items:flex-start;justify-content:center;padding:12vh 24px 24px}
.paletteBackdrop.is-open{display:flex;animation:scrim-in var(--dur-2) var(--ease) both}
.paletteBackdrop.is-open .palette{animation:modal-in var(--dur-2) var(--ease) both}
.palette{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:7px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:60vh}
.palette__in{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex:none}
.palette__in svg{color:var(--text-3);flex:none}
.palette__in input{flex:1;background:none;border:0;color:var(--text);font-size:var(--t-xl);outline:none}
.palette__in input::placeholder{color:var(--text-3)}
.palette__list{overflow:auto;padding:6px;min-height:0}
.palette__sec{padding:9px 10px 4px;font-size:var(--t-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.palette__item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;
  border-radius:var(--radius);color:var(--text-2);font-size:var(--t-md)}
.palette__item .sw{width:8px;height:8px;border-radius:2px;flex:none;background:var(--c,var(--line))}
.palette__item b{font-weight:600;color:var(--text)}
.palette__item small{margin-left:auto;font-size:var(--t-xs);color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.palette__item.is-active{background:var(--surface-3);color:var(--text)}
.palette__empty{padding:26px 14px;text-align:center;color:var(--text-3);font-size:var(--t-md)}
.palette__foot{flex:none;display:flex;gap:14px;padding:9px 15px;border-top:1px solid var(--line);
  font-size:var(--t-xs);color:var(--text-3)}
.palette__foot kbd{font-family:var(--narrow);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:5px}

/* ---------- gallery ----------
   The one view meant to be read from across a room rather than worked
   in: today's shows, their rooms, and who is called when, at a size
   that survives a projector and a few metres of distance. */
.gallery{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  padding:26px 32px 20px;overflow:auto}
.gallery[hidden]{display:none}
.gallery__head{display:flex;align-items:flex-start;gap:24px;padding-bottom:16px;
  border-bottom:2px solid var(--line)}
.gallery__day{font-family:var(--wide);font-weight:700;font-size:34px;letter-spacing:-.01em;line-height:1.05}
.gallery__sub{font-size:var(--t-xl);color:var(--text-3);margin-top:5px}
.gallery__clock{margin-left:auto;font-family:var(--wide);font-weight:700;font-size:46px;
  line-height:1;color:var(--now)}
.gallery__x{width:38px;height:38px;flex:none}
.gallery__body{display:grid;gap:18px;padding-top:18px;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-content:start}
.gshow{border-radius:5px;background:var(--surface);padding:16px 18px 14px;position:relative;overflow:hidden}
.gshow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.gshow.is-live{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.gshow__t{display:flex;align-items:baseline;gap:12px}
.gshow__time{font-family:var(--wide);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;
  color:color-mix(in srgb,var(--c) 70%,var(--text))}
.gshow__live{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--well);background:var(--now);border-radius:2px;padding:2px 7px}
.gshow__name{font-size:22px;font-weight:700;margin-top:3px;line-height:1.15}
.gshow__where{font-size:var(--t-lg);color:var(--text-3);margin-top:3px}
.gshow__crew{margin-top:12px;display:grid;gap:3px}
.gcrew{display:flex;align-items:baseline;gap:10px;font-size:var(--t-lg);line-height:1.5}
.gcrew__t{font-variant-numeric:tabular-nums;color:var(--text-3);width:52px;flex:none}
.gcrew__r{color:var(--text-3);width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcrew__n{font-weight:600}
.gcrew--open .gcrew__n{color:var(--soft);font-weight:400;font-style:italic}
.gallery__empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--text-3);font-size:var(--t-xl)}
@media print{ .gallery{display:none !important} }

/* ---------- printed sheets ----------
   Two of them, both print-only: the daily studio schedule, laid out the
   way PMG_STUDIODAILY.RPT comes out of ScheduALL so the floor doesn't
   have to learn a new document, and a crew member's month. */
.sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:11mm 12mm}
  body{background:#fff}
  .app,.toast,.modalBackdrop,.paletteBackdrop,.hovercard{display:none !important}
  .sheet{display:block;color:#000;font-family:var(--sans);font-size:9.5pt;line-height:1.3}

  /* one work order per page, the way the report paginates */
  .wo{break-after:page;position:relative;padding-bottom:16mm}
  .wo:last-child{break-after:auto}
  .wo__pagehead{display:flex;font-size:7.5pt;padding-bottom:2mm}
  .wo__pagehead span:last-child{margin-left:auto}
  .wo__title{font-size:13pt;font-weight:700;letter-spacing:-.01em;margin-bottom:1mm}
  .wo__fields{display:grid;grid-template-columns:auto 1fr;gap:0 6px;font-size:9pt;margin-bottom:3mm}
  .wo__fields dt{font-weight:700;white-space:nowrap}
  .wo__fields dd{margin:0}
  .wo__sec{font-weight:700;font-size:9.5pt;margin-top:3mm}
  .wo table{width:100%;border-collapse:collapse;margin-top:1mm}
  .wo th{text-align:left;font-weight:700;font-size:8.5pt;border-bottom:.6pt solid #000;
    padding:1mm 3mm 1mm 0;white-space:nowrap}
  .wo td{padding:.8mm 3mm .8mm 0;font-size:9pt;vertical-align:top;border-bottom:.3pt solid #d6d6d6}
  .wo .c-t{width:13mm;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wo .c-d{width:44mm}
  .wo .c-r{width:52mm}
  .wo .c-p{width:30mm;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wo .open{font-style:italic}
  .wo__note{font-size:8.5pt;margin-top:2mm}
  .wo__foot{position:absolute;bottom:0;left:0;right:0;font-size:7pt;line-height:1.35;
    border-top:.3pt solid #999;padding-top:1mm}

  /* a crew member's month */
  .ros{break-after:page}
  .ros:last-child{break-after:auto}
  .ros__head{display:flex;align-items:flex-end;gap:8mm;border-bottom:1.2pt solid #000;padding-bottom:2mm}
  .ros__name{font-size:14pt;font-weight:700;letter-spacing:-.01em}
  .ros__sub{font-size:9pt}
  .ros__meta{margin-left:auto;text-align:right;font-size:8.5pt}
  .ros table{width:100%;border-collapse:collapse;margin-top:3mm}
  .ros th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.04em;
    border-bottom:.6pt solid #000;padding:1mm 3mm 1mm 0;white-space:nowrap}
  .ros td{padding:1mm 3mm 1mm 0;font-size:9pt;border-bottom:.3pt solid #dcdcdc;vertical-align:top}
  .ros .c-day{width:26mm}
  .ros .c-t{width:12mm;font-variant-numeric:tabular-nums}
  .ros .c-h{width:14mm;font-variant-numeric:tabular-nums;text-align:right}
  .ros tr.off td{color:#8a8a8a}
  .ros tfoot td{font-weight:700;border-top:.6pt solid #000;border-bottom:0;padding-top:1.5mm}
  .ros__foot{margin-top:4mm;font-size:7.5pt;border-top:.3pt solid #999;padding-top:1mm}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}

@media (max-width:960px){
  :root{--gutter:6px}
  .key,.search kbd{display:none}
  .tray__label{width:150px}
  .weeknav__label{min-width:0}
  .weeknav__label small{display:none}
}

   points around the wheel at full chroma — that reads as a chart legend.

/* Confirm these against the enterprise agreement. */

/* ============================================================
   2. SHOWS — the standing definition of a program: which days it
   runs, where, who normally crews it, and its rundown. A booking is
   one airing of a show. This is the only place the standing crew
   lives: saving a change here can be pushed down onto every booking
   already on the roster.
   ============================================================ */
let SHOWS = [], SHOW_SEQ = 0, POS_SEQ = 0;
const newShowId = ()=> 'sw'+String(++SHOW_SEQ).padStart(3,'0');
const newPosId  = ()=> 'p'+String(++POS_SEQ).padStart(4,'0');

/* The 2026 season. Each show carries its own window, so "generate
   bookings" opens on the right range instead of an empty date box. */
const SEASON = { start:'2026-03-01', end:'2026-10-01' };

/* Shorthands for the two studios these shows live in. STB is Studio B
   floor and control, STA is Studio A floor and control — both halves
   are held, since a show in the studio holds the gallery with it. */
const STB = ['fl-b','cr-b'];
const STA = ['fl-a','cr-a'];

/* One seat on the standing crew: the role, who normally fills it
   (null means it goes to the freelance pool each week), and call and
   wrap as minutes either side of air. Offsets rather than clock times,
   so the whole crew moves when the show time moves. */
function P(roleId, staffId, call, wrap){
  return { pid:newPosId(), roleId, staffId:staffId||null,
    call: call==null ? 60 : call, wrap: wrap==null ? 30 : wrap };
}

function makeShow(o){
  const sh = { id:newShowId(), name:o.name, colour:o.colour, notes:o.notes||'',
    facilityIds:o.facilityIds, positions:o.positions, days:o.days,
    start:o.start, end:o.end,
    seasonStart:o.seasonStart || SEASON.start, seasonEnd:o.seasonEnd || SEASON.end,
    /* A one-off runs once, on oneOffDate, and ignores days and the
       season window entirely — a special, a launch, a pilot. */
    oneOff:!!o.oneOff, oneOffDate:o.oneOffDate || '',
    /* Everything a ScheduALL work order carries in its header. A booking
       copies these down at generation, so one airing can be amended
       without touching the standing definition. */
    project:o.project||'', jobDetails:o.jobDetails||'', tx:o.tx||[],
    rundown:o.rundown||[] };
  SHOWS.push(sh);
  return sh;
}

/* ============================================================
   3. SEED — the season on the roster
   Every booking is an airing of one of the shows above, built across
   the season window by the same path the app's "Generate bookings"
   takes. Nothing here is hand-typed against a date.
   ============================================================ */
let BOOKINGS = [], SHIFTS = [], BK_SEQ = 0, SH_SEQ = 0;
const newBkId = ()=> 'bk'+String(++BK_SEQ).padStart(4,'0');
const newShId = ()=> 'sh'+String(++SH_SEQ).padStart(5,'0');

const TODAY = '2026-09-01';
/* Crew is confirmed four weeks out and pencilled beyond that, which is
   the window the schedulers actually work to. */
const CONFIRMED_TO = addDays(TODAY, 27);

/* Work orders are the number the crew quote on the phone, so they are
   allocated once, in date order, and never reused. */
let WO_SEQ = 1026400;
const newWorkOrder = ()=> ++WO_SEQ;

function seedAiring(sh, date){
  const pencilled = date > CONFIRMED_TO;
  const b = { id:newBkId(), wo:newWorkOrder(), name:sh.name, client:'', date,
    start:sh.start, end:sh.end,
    facilityIds:[...sh.facilityIds], colour:sh.colour,
    project:sh.project, jobDetails:sh.jobDetails, tx:sh.tx.map(t=>({...t})),
    status: pencilled ? 'pencilled' : 'confirmed', notes:sh.notes, showId:sh.id };
  BOOKINGS.push(b);
  sh.positions.forEach(p=>{
    SHIFTS.push({ id:newShId(), bookingId:b.id, showId:sh.id, posId:p.pid,
      staffId:p.staffId, roleId:p.roleId, date,
      start:posStart(sh,p), end:posEnd(sh,p),
      status: (!p.staffId || pencilled) ? 'draft' : 'published', note:'' });
  });
  return b;
}

/* Seeded day by day rather than show by show, so the work order numbers
   climb with the calendar the way a real allocation does. */
(function seedSeason(){
  const from = SHOWS.reduce((a,sh)=> sh.seasonStart<a ? sh.seasonStart : a, SHOWS[0].seasonStart);
  const to   = SHOWS.reduce((a,sh)=> sh.seasonEnd>a   ? sh.seasonEnd   : a, SHOWS[0].seasonEnd);
  for (let d = from; d <= to; d = addDays(d,1)){
    const dow = toDate(d).getDay();
    SHOWS.filter(sh=> sh.oneOff
        ? sh.oneOffDate===d
        : sh.days.includes(dow) && d>=sh.seasonStart && d<=sh.seasonEnd)
      .sort((a,b)=> mins(a.start)-mins(b.start))
      .forEach(sh=> seedAiring(sh, d));
  }
})();

/* ---------- cover, and what it costs ----------
   A season seeded from templates is tidier than a real week ever is.
   These are the covers a coordinator actually ends up making — someone
   picking up an open position at short notice — and they are what push
   people into the overtime and rostered-day-off cases the roster is
   supposed to warn about. Each one names why it exists. */
(function seedCover(){
  const week = d => { const m = mondayOf(TODAY); return addDays(m, d); };
  const cover = (date, showName, roleId, staffId, rdo, note)=>{
    const b = BOOKINGS.find(x=>x.date===date && x.name===showName);
    if (!b) return;
    const open = SHIFTS.find(x=>x.bookingId===b.id && x.roleId===roleId && !x.staffId);
    if (!open) return;
    open.staffId = staffId;
    open.status = 'published';
    if (rdo) open.rdo = true;
    if (note) open.note = note;
  };

  /* Six days worked: a day off given back, though the hours stay inside
     the standard week. The roster owes him the day. */
  cover(week(5), 'Super Saturday', 'cam', 's01', true,
    'Cover for the freelance camera booking that fell through.');

  /* Just into reasonable additional, and a sixth day worked: the case
     that is fine to roster but has to be seen before it's repeated. */
  cover(week(4), 'Friday Night Football', 'cam', 's22', true,
    'Covering the freelance camera position.');

  /* A seventh day. Two days off owed back, and well past forty hours. */
  cover(week(5), 'Super Saturday', 'wardrobe', 's34', true,
    'Wardrobe cover — no freelancer available.');
  cover(week(6), 'Sunday Ticket', 'wardrobe', 's34', true,
    'Second day of wardrobe cover.');

  /* Straight past the forty-hour mark, on an eleven-hour Friday. */
  cover(week(4), 'Friday Night Football', 'evs', 's11', false,
    'Second replay operator added for the double header.');
})();

const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW2 = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July',
  'August','September','October','November','December'];

function daysSummary(days){
  if (!days.length) return 'No days set';
  const set = new Set(days);
  if (days.length===5 && [1,2,3,4,5].every(d=>set.has(d))) return 'Weekdays';
  if (days.length===2 && set.has(0) && set.has(6)) return 'Weekends';
  if (days.length===7) return 'Every day';
  return [...days].sort((a,b)=>a-b).map(d=>DOW[d].slice(0,3)).join(', ');
}

function toDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function toIso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(iso,n){ const d=toDate(iso); d.setDate(d.getDate()+n); return toIso(d); }
function mondayOf(iso){ const d=toDate(iso); d.setDate(d.getDate()-((d.getDay()+6)%7)); return toIso(d); }
function mins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
/* Accepts what people actually type into a clock field — 1630, 16.30,
   16:3, 930, 9 — and returns 24-hour HH:MM, or null if it isn't a time.
   No AM/PM: this app is 24-hour end to end, and a bare "9" is 09:00. */
function normaliseTime(raw){
  const t = String(raw||'').trim().toLowerCase().replace(/[^0-9]/g,'');
  if (!t) return null;
  let h, m;
  if (t.length <= 2){ h = +t; m = 0; }
  else if (t.length === 3){ h = +t.slice(0,1); m = +t.slice(1); }
  else if (t.length === 4){ h = +t.slice(0,2); m = +t.slice(2); }
  else return null;
  if (!(h>=0 && h<=23 && m>=0 && m<=59)) return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
/* Every clock field goes through the same guard: a good value is
   rewritten in 24-hour form and handed on, a bad one is flagged and the
   previous value stays. */
function bindTimeField(el, apply){
  if (!el) return;
  let was = el.value;
  el.onchange = ()=>{
    const v = normaliseTime(el.value);
    if (!v){ el.classList.add('is-bad'); el.value = was; toast('Times are 24-hour — try 16:30.'); return; }
    el.classList.remove('is-bad');
    el.value = was = v;
    apply(v);
  };
}

function addMins(t, n){ let m = (mins(t)+Math.round(n)) % 1440; if (m<0) m += 1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
/* A standing position stores its call and wrap as offsets, so both are
   resolved against whatever the show's air times are right now. */
function posStart(sh, p){ return addMins(sh.start, -(p.call||0)); }
function posEnd(sh, p){ return addMins(sh.end, p.wrap||0); }
function dayNo(iso){ return Math.round(toDate(iso).getTime()/86400000); }
const SPAN_CACHE = new Map();
function span(x){
  const key = x.date+x.start+x.end;
  let v = SPAN_CACHE.get(key);
  if (!v){ const b=dayNo(x.date)*1440; let s=b+mins(x.start), e=b+mins(x.end); if (e<=s) e+=1440;
    v = {s,e}; SPAN_CACHE.set(key, v); }
  return v;
}
function overlaps(a,b){ const A=span(a),B=span(b); return A.s<B.e && B.s<A.e; }
function durH(x){ const {s,e}=span(x); return (e-s)/60; }
/* Rounding 7.5 to "8 hours" on a roster people are paid against is a
   quiet lie, so hours are shown to the half. */
function fmtH(h){
  const m = Math.round(h*60), hh = Math.floor(m/60), mm = m%60;
  return mm ? `${hh}h ${mm}m` : `${hh}h`;
}
function fmtDur(h){ const hh=Math.floor(h), mm=Math.round((h-hh)*60); return mm?`${hh}h ${mm}m`:`${hh}h`; }
function hhmm(t){ return t.replace(':',''); }
function initials(n){ return n.split(' ').map(p=>p[0]).slice(0,2).join(''); }
function shortDay(iso){ const d=toDate(iso); return `${DOW[d.getDay()].slice(0,3)} ${d.getDate()} ${MON[d.getMonth()]}`; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
